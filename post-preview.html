      function goToProofEditor(){
        window.location.href = 'editor.html?lang=' + encodeURIComponent(currentLanguage.toLowerCase());
      }

      function tryParseJson(text){
        if(typeof text !== 'string') return null;
        const trimmed = text.trim();
        if(!trimmed || !/^[\\[{]/.test(trimmed)) return null;
        try{
          return JSON.parse(trimmed);
        }catch(err){
          return null;
        }
      }

      function delay(ms){
        return new Promise((resolve)=>setTimeout(resolve, ms));
      }

      function formatHelperProgress(progress, message){
        const text = String(message || '').trim();
        if(Number.isFinite(progress)){
          const safeProgress = Math.max(0, Math.min(100, Math.round(progress)));
          return text ? `${safeProgress}% ${text}` : `${safeProgress}%`;
        }
        return text;
      }

      function setHelperProgress(progress, message, tone){
        setHelperStatus(formatHelperProgress(progress, message), tone);
      }

      function isCicFormat(value){
        const normalized = String(value || '').trim().toLowerCase();
        return normalized === 'cic' || normalized === 'cic-v1' || normalized.includes('cic');
      }

      function removeLocalValue(key){
        try{
          localStorage.removeItem(key);
        }catch(err){
          // Ignore storage access failures during navigation cleanup.
        }
      }

      function removeSessionValue(key){
        try{
          sessionStorage.removeItem(key);
        }catch(err){
          // Ignore storage access failures during navigation cleanup.
        }
      }

      function removeCookieValue(name){
        try{
          document.cookie = `${name}=; max-age=0; path=/; SameSite=Lax`;
        }catch(err){
          // Ignore cookie cleanup failures.
        }
      }

      async function clearWorkflowBeforeInitialSearch(){
        removeLocalValue(MODE_PERSIST_KEY);
        removeLocalValue(COOKIE_HISTORY_CONSENT_KEY);
        removeSessionValue(EDITOR_INIT_KEY);
        removeSessionValue(EDITOR_RETURN_KEY);
        removeCookieValue(COOKIE_HISTORY_COOKIE);
        removeCookieValue(`${COOKIE_HISTORY_COOKIE}Consent`);

        if(store && typeof store.clear === 'function'){
          try{
            await store.clear();
          }catch(err){
            // The remote save already succeeded; local cleanup should not block navigation.
          }
        }
      }

      async function showCicSuccessPopup(){
        if(!cicSuccessPopupEl){
          window.alert('CIC変換成功');
          return;
        }
        cicSuccessPopupEl.classList.add('is-visible');
        cicSuccessPopupEl.setAttribute('aria-hidden', 'false');
        await delay(1150);
      }

      async function returnToInitialSearchAfterCicSave(){
        if(cicSuccessRedirecting) return;
        cicSuccessRedirecting = true;
        await showCicSuccessPopup();
        await clearWorkflowBeforeInitialSearch();
        window.location.href = CIC_SUCCESS_RETURN_URL;
      }

      function summarizeProxyFailure(response, raw){
        const status = response && typeof response.status === 'number'
          ? response.status
          : 0;
        const statusText = response && typeof response.statusText === 'string' && response.statusText.trim()
          ? response.statusText.trim()
          : '';
        const normalizedRaw = String(raw || '').trim();
        const lowerRaw = normalizedRaw.toLowerCase();

        if(status === 502){
          return 'Helper proxy returned 502 Bad Gateway. The app may still be waking up.';
        }
        if(status === 503){
          return 'Helper proxy returned 503 Service Unavailable. The app may still be waking up.';
        }
        if(status === 504){
          return 'Helper proxy timed out while waiting for the server.';
        }
        if(normalizedRaw){
          if(lowerRaw.includes('bad gateway')){
            return 'Helper proxy returned 502 Bad Gateway.';
          }
          if(lowerRaw.includes('service unavailable')){
            return 'Helper proxy returned 503 Service Unavailable.';
          }
        }

        return status
          ? ('Helper proxy returned ' + status + (statusText ? (' ' + statusText) : '') + '.')
          : 'Helper proxy request failed.';
      }

      async function warmHelperProxy(onProgress){
        const directHelperBaseUrl = resolveDirectHelperBaseUrl(helperInfoCache);
        const steps = [
          {
            progress: 10,
            label: 'Loading helper',
            baseUrl: '',
            path: '/api/helper/info',
            sameOrigin: true,
            headers: {}
          }
        ];

        if(directHelperBaseUrl){
          steps.push(
            {
              progress: 12,
              label: 'Checking helper',
              baseUrl: directHelperBaseUrl,
              path: '/healthz',
              sameOrigin: false,
              headers: {}
            },
            {
              progress: 14,
              label: 'Loading helper',
              baseUrl: directHelperBaseUrl,
              path: '/api/helper/info',
              sameOrigin: false,
              headers: buildDirectHelperHeaders()
            }
          );
        }

        let helperReady = false;

        for(let round = 0; round < 6; round += 1){
          for(const step of steps){
            if(typeof onProgress === 'function'){
              onProgress(Math.min(24, step.progress + round * 2), step.label);
            }
            try{
              const baseUrl = step.sameOrigin ? '' : step.baseUrl;
              if(!step.sameOrigin && !baseUrl){
                continue;
              }
              const response = await fetch(baseUrl + step.path, {
                method: 'GET',
                cache: 'no-store',
                credentials: step.sameOrigin ? 'same-origin' : 'omit',
                mode: step.sameOrigin ? 'same-origin' : 'cors',
                headers: step.headers || {}
              });
              if(!response.ok){
                continue;
              }
              if(step.path === '/api/helper/info'){
                const raw = await response.text();
                const payload = tryParseJson(raw);
                if(payload && typeof payload === 'object'){
                  helperInfoCache = payload;
                }
                helperReady = true;
                continue;
              }
              if(step.baseUrl === directHelperBaseUrl){
                helperReady = true;
              }
            }catch(err){
              // ignore wake-up probe failures; retry until timeout budget is used
            }
          }

          if(helperReady){
            return true;
          }

          if(round < 5){
            await delay(3000);
          }
        }

        return helperReady;
      }

      function shouldRetryHelperResponse(response, payload, raw){
        if(!response) return false;
        if(![502, 503, 504].includes(response.status)) return false;
        if(payload && typeof payload === 'object') return true;
        const text = String(raw || '').trim().toLowerCase();
        if(!text) return true;
        return (
          text.includes('bad gateway')
          || text.includes('service unavailable')
          || text.includes('hibernate-wake-error')
          || text.includes('no-deploy')
        );
      }

      const DEFAULT_DIRECT_HELPER_BASE_URL = '';
      const HELPER_EXECUTION_BRIDGE_HEADER = 'X-Ivucx-Execution-Base-Url';

      function resolveExecutionBridgeBaseUrl(){
        if(typeof window !== 'undefined' && window.location && typeof window.location.origin === 'string'){
          const origin = window.location.origin.trim();
          if(origin){
            return origin.replace(/\/+$/, '');
          }
        }
        return 'https://provf.onrender.com';
      }

      function buildDirectHelperHeaders(extraHeaders){
        return Object.assign(
          {},
          extraHeaders || {},
          {
            [HELPER_EXECUTION_BRIDGE_HEADER]: resolveExecutionBridgeBaseUrl()
          }
        );
      }

      async function fetchHelperInfoFromUrl(baseUrl, sameOrigin){
        const response = await fetch((baseUrl || '') + '/api/helper/info', {
          method: 'GET',
          cache: 'no-store',
          credentials: sameOrigin ? 'same-origin' : 'omit',
          mode: sameOrigin ? 'same-origin' : 'cors',
          headers: sameOrigin ? {} : buildDirectHelperHeaders()
        });
        const raw = await response.text();
        const payload = tryParseJson(raw);
        return { response, raw, payload };
      }

      async function postHelperSubmitWithRetry(body, onProgress){
        const attempts = [
          { delayMs: 0, progress: 42, label: 'Submitting' },
          { delayMs: 1800, progress: 48, label: 'Waking server' },
          { delayMs: 4200, progress: 54, label: 'Retrying submit' },
          { delayMs: 7000, progress: 58, label: 'Retrying again' }
        ];
        const directHelperBaseUrl = resolveDirectHelperBaseUrl(helperInfoCache);
        let lastRaw = '';
        let lastStatus = 0;

        for(let index = 0; index < attempts.length; index += 1){
          const attempt = attempts[index];
          if(typeof onProgress === 'function'){
            onProgress(attempt.progress, attempt.label);
          }
          if(attempt.delayMs > 0){
            await delay(attempt.delayMs);
          }

          const response = await fetch(directHelperBaseUrl + '/api/helper/submit', {
            method: 'POST',
            cache: 'no-store',
            credentials: directHelperBaseUrl ? 'omit' : 'same-origin',
            mode: directHelperBaseUrl ? 'cors' : 'same-origin',
            headers: {
              'Content-Type': 'application/json',
              ...(directHelperBaseUrl ? buildDirectHelperHeaders() : {})
            },
            body: JSON.stringify(body)
          });

          const raw = await response.text();
          const payload = tryParseJson(raw);
          lastRaw = raw;
          lastStatus = response.status;

          if(!shouldRetryHelperResponse(response, payload, raw) || index === attempts.length - 1){
            return { response, raw, payload };
          }
        }

        throw new Error(lastRaw || ('Helper submission failed with status ' + lastStatus + '.'));
      }

      function shouldFallbackToTypedLambda(requestedFormat, message){
        if(String(requestedFormat || '').trim().toLowerCase() !== 'cic-v1'){
          return false;
        }
        const normalized = String(message || '').trim().toLowerCase();
        if(!normalized){
          return true;
        }
        return (
          normalized.includes('helper proxy returned 502')
          || normalized.includes('helper proxy returned 503')
          || normalized.includes('helper proxy returned 504')
          || normalized.includes('execution server returned 502')
          || normalized.includes('execution server returned 503')
          || normalized.includes('execution server returned 504')
          || normalized.includes('lean cic exporter failed')
          || normalized.includes('coq cic')
          || normalized.includes('spawn lake enoent')
          || normalized.includes('spawn coqc enoent')
          || normalized.includes('invalid response from helper proxy')
          || normalized.includes('bad gateway')
          || normalized.includes('service unavailable')
        );
      }

      function setFutureBusy(busy){
        helperBusy = !!busy;
        if(!futureBtn) return;
        futureBtn.disabled = helperBusy;
        futureBtn.setAttribute('aria-busy', helperBusy ? 'true' : 'false');
        futureBtn.textContent = helperBusy ? '...' : '→';
      }

      function setHelperStatus(message, tone){
        if(!helperStatusEl) return;
        const text = String(message || '').trim();
        helperStatusEl.hidden = !text;
        helperStatusEl.classList.remove('pending', 'success', 'error');
        if(!text){
          helperStatusEl.textContent = '';
          return;
        }
        helperStatusEl.textContent = text;
        if(tone === 'success' || tone === 'error'){
          helperStatusEl.classList.add(tone);
        }else{
          helperStatusEl.classList.add('pending');
        }
      }

      function formatBountyAmount(amountCents, currency){
        const amount = Number(amountCents) || 0;
        const code = String(currency || 'usd').trim().toUpperCase() || 'USD';
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: code,
          maximumFractionDigits: amount % 100 === 0 ? 0 : 2
        }).format(amount / 100);
      }

      function readBountyAmountCents(){
        const amount = Number(bountyAmountEl && bountyAmountEl.value);
        if(!Number.isFinite(amount)) return 0;
        return Math.round(amount * 100);
      }

      function setBountyStatus(message, tone){
        if(!bountyStatusEl) return;
        const text = String(message || '').trim();
        bountyStatusEl.textContent = text;
        bountyStatusEl.classList.remove('error', 'success');
        if(tone === 'error' || tone === 'success'){
          bountyStatusEl.classList.add(tone);
        }
      }

      function setBountyBusy(busy){
        bountyBusy = !!busy;
        if(bountyCheckoutBtn){
          bountyCheckoutBtn.disabled = bountyBusy;
          bountyCheckoutBtn.textContent = bountyBusy ? 'Opening checkout...' : 'Fund bounty';
        }
      }

      function getDraftBounty(draft){
        const bounty = draft && draft.bounty && typeof draft.bounty === 'object'
          ? draft.bounty
          : null;
        return bounty;
      }

      function syncBountyPanel(draft){
        if(!bountyPanelEl) return;
        const isProblem = currentProblemKind === 'problem';
        bountyPanelEl.hidden = !isProblem;
        if(!isProblem) return;

        const bounty = getDraftBounty(draft);
        const amountCents = bounty && Number(bounty.amountCents) > 0 ? Number(bounty.amountCents) : 1000;
        const currency = bounty && bounty.currency ? bounty.currency : 'usd';
        if(bountyAmountEl){
          bountyAmountEl.value = String(Math.max(1, Math.round(amountCents / 100)));
        }
        if(bounty && (bounty.paymentStatus === 'paid' || bounty.status === 'paid')){
          if(bountyStateEl) bountyStateEl.textContent = 'Funded ' + formatBountyAmount(amountCents, currency);
          setBountyStatus('This problem has a funded bounty.', 'success');
        }else if(bounty && bounty.stripeSessionId){
          if(bountyStateEl) bountyStateEl.textContent = 'Checkout created';
          setBountyStatus('Checkout was created. Complete payment to fund the bounty.');
        }else{
          if(bountyStateEl) bountyStateEl.textContent = 'Not funded';
          setBountyStatus('');
        }
      }

      async function patchBounty(bounty){
        if(!store || typeof store.patch !== 'function') return null;
        return store.patch({
          bounty: {
            ...bounty,
            updatedAt: new Date().toISOString()
          }
        });
      }

      function removeBountyQueryParams(){
        try{
          const url = new URL(window.location.href);
          url.searchParams.delete('bounty');
          url.searchParams.delete('session_id');
          window.history.replaceState({}, '', url.pathname + (url.search ? url.search : '') + url.hash);
        }catch(err){
          // Ignore history cleanup failures.
        }
      }

      async function handleBountyReturn(draft){
        const params = new URLSearchParams(window.location.search);
        const state = params.get('bounty');
        const sessionId = params.get('session_id');
        if(state === 'cancelled'){
          setBountyStatus('Bounty checkout was cancelled.');
          removeBountyQueryParams();
          return draft;
        }
        if(state !== 'success' || !sessionId) return draft;

        setBountyStatus('Confirming bounty payment...');
        try{
          const response = await fetch('/api/bounty-checkout?session_id=' + encodeURIComponent(sessionId), {
            method: 'GET',
            credentials: 'same-origin',
            headers: { 'Accept': 'application/json' }
          });
          const raw = await response.text();
          const payload = tryParseJson(raw);
          if(!response.ok || !payload){
            throw new Error(payload && payload.error ? payload.error : raw || 'Could not confirm bounty payment.');
          }
          const nextBounty = {
            amountCents: Number(payload.amountTotal) || 0,
            currency: payload.currency || 'usd',
            status: payload.paid ? 'paid' : (payload.status || 'open'),
            paymentStatus: payload.paymentStatus || '',
            stripeSessionId: payload.sessionId || sessionId
          };
          await patchBounty(nextBounty);
          const nextDraft = {
            ...(draft || {}),
            bounty: {
              ...(draft && draft.bounty && typeof draft.bounty === 'object' ? draft.bounty : {}),
              ...nextBounty,
              updatedAt: new Date().toISOString()
            }
          };
          syncBountyPanel(nextDraft);
          setBountyStatus(
            payload.paid
              ? 'Bounty payment confirmed.'
              : 'Checkout returned, but Stripe has not marked the payment as paid yet.',
            payload.paid ? 'success' : ''
          );
          removeBountyQueryParams();
          return nextDraft;
        }catch(err){
          setBountyStatus(err && err.message ? err.message : 'Could not confirm bounty payment.', 'error');
          removeBountyQueryParams();
          return draft;
        }
      }

      async function startBountyCheckout(){
        if(bountyBusy) return;
        const amountCents = readBountyAmountCents();
        if(amountCents < 100){
          setBountyStatus('Enter at least $1.', 'error');
          return;
        }

        const draft = store && typeof store.read === 'function'
          ? await store.read()
          : null;
        const proofPayload = getProofPayload(draft);
        if(!proofPayload){
          setBountyStatus('No saved problem code is available yet.', 'error');
          return;
        }
        if(proofPayload.problemKind !== 'problem'){
          setBountyStatus('Bounties can be added to problem posts only.', 'error');
          return;
        }

        setBountyBusy(true);
        setBountyStatus('Creating Stripe checkout...');
        try{
          const response = await fetch('/api/bounty-checkout', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              amountCents,
              currency: 'usd',
              title: proofPayload.title || titleEl.textContent || 'Untitled problem',
              problemKind: proofPayload.problemKind,
              language: proofPayload.language,
              fileName: proofPayload.fileName,
              clientReferenceId: 'provf-' + Date.now().toString(36)
            })
          });
          const raw = await response.text();
          const payload = tryParseJson(raw);
          if(!response.ok || !payload || !payload.url){
            throw new Error(payload && payload.error ? payload.error : raw || 'Could not create Stripe checkout.');
          }
          await patchBounty({
            amountCents,
            currency: payload.currency || 'usd',
            status: 'checkout_created',
            paymentStatus: '',
            stripeSessionId: payload.sessionId || ''
          });
          window.location.href = payload.url;
        }catch(err){
          setBountyStatus(err && err.message ? err.message : 'Could not start bounty checkout.', 'error');
          setBountyBusy(false);
        }
      }

      function describeHelperJob(job){
        const status = job && typeof job.status === 'string'
          ? job.status.toLowerCase()
          : '';
        const progressMeta = job && job.progress && typeof job.progress === 'object'
          ? job.progress
          : null;

        if(progressMeta){
          const percent = Number.isFinite(Number(progressMeta.percent))
            ? Number(progressMeta.percent)
            : null;
          const message = typeof progressMeta.message === 'string' && progressMeta.message.trim()
            ? progressMeta.message.trim()
            : (
              typeof progressMeta.stage === 'string' && progressMeta.stage.trim()
                ? progressMeta.stage.trim()
                : ''
            );
          if(percent !== null || message){
            return {
              progress: percent !== null ? percent : (status === 'running' ? 84 : 72),
              message: message || (status === 'running' ? 'Processing' : 'Queued')
            };
          }
        }

        if(status === 'queued'){
          return {
            progress: Math.min(78, 60 + helperPollTicks * 3),
            message: 'Queued'
          };
        }

        if(status === 'running'){
          return {
            progress: Math.min(94, 80 + helperPollTicks * 2),
            message: 'Processing'
          };
        }

        if(status === 'succeeded'){
          return {
            progress: 100,
            message: 'Saved'
          };
        }

        return {
          progress: 70,
          message: 'Working'
        };
      }

      function extractHelperError(payload, fallback){
        if(payload && typeof payload.error === 'string' && payload.error.trim()){
          return payload.error.trim();
        }
        if(payload && payload.job && payload.job.error && typeof payload.job.error.message === 'string'){
          return payload.job.error.message;
        }
        if(payload && payload.details && typeof payload.details.error === 'string'){
          return payload.details.error;
        }
        return fallback || 'Helper request failed.';
      }

      async function fetchHelperInfo(){
        if(helperInfoCache) return helperInfoCache;
        if(helperInfoRequest) return helperInfoRequest;
        helperInfoRequest = (async ()=>{
          const directBaseUrl = resolveDirectHelperBaseUrl(null);
          const attempts = [
            { baseUrl: '', sameOrigin: true }
          ];
          if(directBaseUrl){
            attempts.push({ baseUrl: directBaseUrl, sameOrigin: false });
          }

          for(const attempt of attempts){
            try{
              const { response, payload } = await fetchHelperInfoFromUrl(attempt.baseUrl, attempt.sameOrigin);
              if(!response.ok || !payload || typeof payload !== 'object'){
                continue;
              }
              helperInfoCache = payload;
              return payload;
            }catch(err){
              // try the next transport
            }
          }
          return null;
        })().finally(()=>{
          helperInfoRequest = null;
        });
        return helperInfoRequest;
      }

      function resolveDirectHelperBaseUrl(info){
        const deployment = info && info.deployment && typeof info.deployment === 'object'
          ? info.deployment
          : null;
        const helperServer = deployment && typeof deployment.helperServer === 'string'
          ? deployment.helperServer.trim()
          : '';
        const host = typeof window !== 'undefined' && window.location && typeof window.location.hostname === 'string'
          ? window.location.hostname.trim().toLowerCase()
          : '';
        const isLocalHost = host === 'localhost' || host === '127.0.0.1' || host === '::1';
        if(!isLocalHost){
          return '';
        }
        if(helperServer){
          return helperServer.replace(/\/+$/, '');
        }
        return DEFAULT_DIRECT_HELPER_BASE_URL.replace(/\/+$/, '');
      }

      function resolveCicRuntime(info, language){
        const runtimes = info && info.runtimes && typeof info.runtimes === 'object'
          ? info.runtimes
          : null;
        const conversionRuntimes = runtimes && runtimes.conversionRuntimes && typeof runtimes.conversionRuntimes === 'object'
          ? runtimes.conversionRuntimes
          : null;
        const cic = conversionRuntimes && conversionRuntimes.cic && typeof conversionRuntimes.cic === 'object'
          ? conversionRuntimes.cic
          : null;
        const key = String(language || '').trim().toLowerCase();
        return cic && cic[key] && typeof cic[key] === 'object'
          ? cic[key]
          : null;
      }

      async function resolveHelperFormat(language){
        const info = await fetchHelperInfo();
        const cicRuntime = resolveCicRuntime(info, language);
        if(cicRuntime && cicRuntime.available){
          return 'cic-v1';
        }
        return 'typed-lambda-v1';
      }

      async function persistHelperResult(patch){
        if(!store || typeof store.patch !== 'function'){
          return;
        }
        await store.patch({
          helper: {
            lambdaConversion: patch
          }
        });
      }

      function hasVercelPersistenceStatus(info){
        return !!(
          info
          && typeof info === 'object'
          && (
            (info.vercelPersistence && typeof info.vercelPersistence === 'object')
            || (
              info.capabilities
              && typeof info.capabilities === 'object'
              && Object.prototype.hasOwnProperty.call(info.capabilities, 'vercelProblemPersistence')
            )
          )
        );
      }

      function isVercelPersistenceConfigured(info){
        if(!hasVercelPersistenceStatus(info)) return true;
        const persistence = info.vercelPersistence && typeof info.vercelPersistence === 'object'
          ? info.vercelPersistence
          : {};
        if(persistence.supabaseConfigured === false) return false;
        if(persistence.urlConfigured === false || persistence.serviceRoleConfigured === false) return false;
        if(info.capabilities && info.capabilities.vercelProblemPersistence === false) return false;
        return true;
      }

      async function persistProblemOnVercel(proofPayload, submitResult, requestedFormat, completedFormat, requestedAt){
        const result = submitResult && submitResult.result && typeof submitResult.result === 'object'
          ? submitResult.result
          : null;
        if(!result || !result.ok){
          return result;
        }
        if(result.storage && result.storage.persisted && result.problemId){
          return result;
        }

        const info = helperInfoCache || await fetchHelperInfo();
        if(!isVercelPersistenceConfigured(info)){
          throw new Error('CIC conversion completed, but Vercel Supabase persistence is not configured.');
        }

        const response = await fetch('/api/helper/persist', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            title: proofPayload.title,
            language: proofPayload.language,
            fileName: proofPayload.fileName,
            code: proofPayload.code,
            bounty: proofPayload.bounty,
            verify: true,
            format: completedFormat || requestedFormat,
            requestedFormat,
            requestedAt,
            jobId: submitResult.jobId || '',
            result
          })
        });

        const raw = await response.text();
        const payload = tryParseJson(raw);
        if(!response.ok || !payload || !payload.ok){
          throw new Error(extractHelperError(payload, raw || 'Supabase save failed.'));
        }
        const saved = payload.result && typeof payload.result === 'object'
          ? payload.result
          : result;
        const persisted = !!(
          saved
          && saved.storage
          && saved.storage.persisted
        );
        if(!persisted){
          const storage = saved && saved.storage && typeof saved.storage === 'object' ? saved.storage : {};
          const warning = saved && typeof saved.persistenceWarning === 'string' && saved.persistenceWarning.trim()
            ? saved.persistenceWarning.trim()
            : '';
          const storageError = typeof storage.error === 'string' && storage.error.trim()
            ? storage.error.trim()
            : '';
          const storageMessage = typeof storage.message === 'string' && storage.message.trim()
            ? storage.message.trim()
            : '';
          throw new Error(warning || storageError || storageMessage || 'CIC conversion completed, but Supabase save did not persist.');
        }
        return saved;
      }

      function isTransientHelperJobFailure(status, payload, raw, errorMessage){
        const normalizedError = String(errorMessage || '').trim().toLowerCase();
        if([502, 503, 504].includes(Number(status || 0))){
          return true;
        }
        const payloadMessage = extractHelperError(payload, '').toLowerCase();
        const normalizedRaw = String(raw || '').trim().toLowerCase();
        return (
          normalizedError.includes('bad gateway')
          || normalizedError.includes('service unavailable')
          || normalizedError.includes('gateway timeout')
          || normalizedError.includes('invalid job response')
          || payloadMessage.includes('bad gateway')
          || payloadMessage.includes('service unavailable')
          || payloadMessage.includes('gateway timeout')
          || normalizedRaw.includes('bad gateway')
          || normalizedRaw.includes('service unavailable')
          || normalizedRaw.includes('hibernate-wake-error')
          || normalizedRaw.includes('no-deploy')
        );
      }

      async function fetchHelperJobFromUrl(baseUrl, jobId, sameOrigin){
        const response = await fetch(baseUrl + '/api/helper/jobs/' + encodeURIComponent(jobId), {
          method: 'GET',
          cache: 'no-store',
          credentials: sameOrigin ? 'same-origin' : 'omit',
          mode: sameOrigin ? 'same-origin' : 'cors',
          headers: sameOrigin ? {} : buildDirectHelperHeaders()
        });
        const raw = await response.text();
        const payload = tryParseJson(raw);
        return { response, raw, payload };
      }

      async function fetchHelperJob(jobId){
        const info = await fetchHelperInfo();
        const directBaseUrl = resolveDirectHelperBaseUrl(info);
        const attempts = [];
        if(directBaseUrl){
          attempts.push({
            label: 'direct-helper',
            sameOrigin: false,
            baseUrl: directBaseUrl
          });
        }
        attempts.push({
          label: 'render-proxy',
          sameOrigin: true,
          baseUrl: ''
        });

        let lastError = null;

        for(const attempt of attempts){
          try{
            const { response, raw, payload } = await fetchHelperJobFromUrl(attempt.baseUrl, jobId, attempt.sameOrigin);
            if(!payload || typeof payload !== 'object'){
              const invalidMessage = raw || 'Invalid job response from helper proxy.';
              if(isTransientHelperJobFailure(response.status, null, raw, invalidMessage)){
                lastError = new Error(summarizeProxyFailure(response, raw));
                continue;
              }
              throw new Error(invalidMessage);
            }
            if(!response.ok){
              const errorMessage = extractHelperError(payload, 'Failed to load helper job.');
              if(isTransientHelperJobFailure(response.status, payload, raw, errorMessage)){
                lastError = new Error(errorMessage);
                continue;
              }
              throw new Error(errorMessage);
            }
            return payload;
          }catch(err){
            const message = err && err.message ? err.message : String(err);
            if(isTransientHelperJobFailure(0, null, '', message)){
              lastError = err;
              continue;
            }
            throw err;
          }
        }

        throw lastError || new Error('Failed to load helper job.');
      }

      const HELPER_JOB_TIMEOUT_MS = 45 * 60 * 1000;

      async function waitForHelperJob(jobId, onUpdate){
        const startedAt = Date.now();
        helperPollTicks = 0;
        while(Date.now() - startedAt < HELPER_JOB_TIMEOUT_MS){
          let payload = null;
          try{
            payload = await fetchHelperJob(jobId);
          }catch(err){
            const message = err && err.message ? err.message : String(err);
            if(isTransientHelperJobFailure(0, null, '', message)){
              if(typeof onUpdate === 'function'){
                onUpdate({
                  status: 'running',
                  progress: {
                    percent: Math.min(92, 64 + helperPollTicks * 2),
                    message: 'Reconnecting'
                  }
                }, null);
              }
              await warmHelperProxy((progress, label)=>{
                const adjusted = Math.min(92, Math.max(36, progress));
                setHelperProgress(adjusted, label, 'pending');
              });
              helperPollTicks += 1;
              await delay(2200);
              continue;
            }
            throw err;
          }
          const job = payload && payload.job && typeof payload.job === 'object' ? payload.job : null;
          if(!job){
            throw new Error('Helper job payload is missing.');
          }
          helperPollTicks += 1;
          if(typeof onUpdate === 'function'){
            onUpdate(job, payload);
          }
          if(job.status === 'succeeded'){
            return job.result || null;
          }
          if(job.status === 'failed'){
            throw new Error(extractHelperError(payload, 'Helper job failed.'));
          }
          await delay(1200);
        }
        throw new Error('Timed out while waiting for helper conversion.');
      }

      function getProofPayload(draft){
        const proof = draft && draft.proof && typeof draft.proof === 'object'
          ? draft.proof
          : null;
        if(!proof || typeof proof.code !== 'string' || !proof.code.trim()){
          return null;
        }
        const title = draft && draft.title && typeof draft.title.text === 'string'
          ? draft.title.text.trim()
          : '';
        const problemKind = getDraftProblemKind(draft);
        return {
          title,
          language: resolveLanguage(proof.language || currentLanguage),
          fileName: typeof proof.fileName === 'string' && proof.fileName.trim()
            ? proof.fileName.trim()
            : currentFileName,
          code: proof.code,
          problemKind,
          bounty: problemKind === 'problem' ? getDraftBounty(draft) : null
        };
      }

      function getDraftProblemKind(draft){
        const candidates = [
          draft && draft.problemKind,
          draft && draft.postKind,
          draft && draft.navigation && draft.navigation.problemKind,
          draft && draft.navigation && draft.navigation.postKind
        ];
        for(const candidate of candidates){
          const normalized = String(candidate || '').trim().toLowerCase();
          if(normalized === 'problem' || normalized === 'theorem') return normalized;
        }
        return 'theorem';
      }

      function normalizeAttachmentPath(path){
        return String(path || '')
          .replace(/\\/g, '/')
          .split('/')
          .filter(part=>part && part !== '.' && part !== '..')
          .join('/');
      }

      function collectDraftAttachments(draft){
        const record = draft
          && draft.summarySlide
          && draft.summarySlide.record
          && typeof draft.summarySlide.record === 'object'
          ? draft.summarySlide.record
          : null;
        const editorState = record && record.editorState && typeof record.editorState === 'object'
          ? record.editorState
          : null;
        const uploads = editorState && Array.isArray(editorState.uploads)
          ? editorState.uploads
          : (editorState && Array.isArray(editorState.slides)
            ? editorState.slides
              .map(slide=>slide && slide.document && typeof slide.document === 'object' ? slide.document : null)
              .filter(Boolean)
            : []);
        return uploads
          .map((upload, index)=>{
            if(!upload || typeof upload !== 'object') return null;
            const title = String(upload.title || upload.name || `attachment-${index + 1}`).trim();
            const relativePath = normalizeAttachmentPath(upload.relativePath || upload.path || title);
            const id = String(upload.blobId || upload.id || `attachment-${index + 1}`).trim();
            return {
              id,
              blobId: id,
              title,
              path: relativePath,
              relativePath,
              kind: String(upload.kind || 'file').trim(),
              ext: String(upload.ext || '').trim(),
              mime: String(upload.mime || '').trim(),
              size: Number(upload.size) || 0,
              scanStatus: String(upload.scanStatus || '').trim(),
              scanLabel: String(upload.scanLabel || '').trim(),
              scanCheckedAt: String(upload.scanCheckedAt || '').trim(),
              importedAt: String(upload.importedAt || '').trim(),
              source: String(upload.source || 'local').trim(),
              url: typeof upload.url === 'string' ? upload.url : '',
              text: typeof upload.text === 'string' ? upload.text : ''
            };
          })
          .filter(Boolean);
      }

      function dataUrlToBlob(dataUrl){
        const raw = String(dataUrl || '');
        const match = raw.match(/^data:([^;,]+)?(;base64)?,(.*)$/);
        if(!match) return null;
        const mime = match[1] || 'application/octet-stream';
        const isBase64 = !!match[2];
        const payload = match[3] || '';
        try{
          const binary = isBase64 ? atob(payload) : decodeURIComponent(payload);
          const bytes = new Uint8Array(binary.length);
          for(let index = 0; index < binary.length; index += 1){
            bytes[index] = binary.charCodeAt(index);
          }
          return new Blob([bytes], { type: mime });
        }catch(err){
          return null;
        }
      }

      async function resolveAttachmentBlob(attachment){
        const blobId = attachment && (attachment.blobId || attachment.id);
        if(blobId && store && typeof store.getUploadBlob === 'function'){
          const blob = await store.getUploadBlob(blobId);
          if(blob) return blob;
        }
        if(attachment && attachment.url && attachment.url.startsWith('data:')){
          return dataUrlToBlob(attachment.url);
        }
        if(attachment && attachment.text){
          return new Blob([attachment.text], { type: attachment.mime || 'text/plain' });
        }
        return null;
      }

      async function postJson(url, body){
        const response = await fetch(url, {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(body)
        });
        const raw = await response.text();
        const payload = tryParseJson(raw);
        if(!response.ok || !payload || payload.ok === false){
          throw new Error(extractHelperError(payload, raw || 'Request failed.'));
        }
        return payload;
      }

      async function uploadToSignedSupabaseUrl(upload, blob){
        const form = new FormData();
        form.append('cacheControl', '3600');
        form.append('', blob);
        const headers = upload && upload.uploadHeaders && typeof upload.uploadHeaders === 'object'
          ? upload.uploadHeaders
          : {};
        const response = await fetch(upload.signedUrl, {
          method: 'PUT',
          headers,
          body: form
        });
        if(!response.ok){
          const raw = await response.text().catch(()=>'');
          throw new Error(raw || `Attachment upload failed (${response.status}).`);
        }
      }

      async function persistProblemAttachmentsOnSupabase(problemId, draft){
        const attachments = collectDraftAttachments(draft);
        if(!problemId || attachments.length === 0){
          return { persisted: true, count: 0, attachments: [] };
        }

        setHelperProgress(96, 'Preparing attachments', 'pending');
        const plan = await postJson('/api/helper/attachments/sign', {
          problemId,
          attachments
        });
        const uploads = Array.isArray(plan.uploads) ? plan.uploads : [];
        const completed = [];

        for(let index = 0; index < uploads.length; index += 1){
          const upload = uploads[index];
          const original = attachments.find(item=>item.id === upload.clientId || item.id === upload.id)
            || attachments[index];
          const blob = await resolveAttachmentBlob(original);
          if(!blob){
            throw new Error(`${original && original.title ? original.title : 'Attachment'} cannot be saved permanently because its file data is missing.`);
          }
          setHelperProgress(
            Math.min(99, 96 + Math.round(((index + 1) / Math.max(1, uploads.length)) * 3)),
            `Uploading attachments ${index + 1}/${uploads.length}`,
            'pending'
          );
          await uploadToSignedSupabaseUrl(upload, blob);
          completed.push({
            ...original,
            bucket: upload.bucket,
            storagePath: upload.storagePath
          });
        }

        const saved = await postJson('/api/helper/attachments/complete', {
          problemId,
          attachments: completed
        });
        return {
          persisted: true,
          count: Array.isArray(saved.attachments) ? saved.attachments.length : completed.length,
          attachments: saved.attachments || completed,
          bucket: saved.bucket || plan.bucket || ''
        };
      }

      async function runHelperConversion(){
        if(helperBusy) return;

        const draft = store && typeof store.read === 'function'
          ? await store.read()
          : null;
        const proofPayload = getProofPayload(draft);

        if(!proofPayload){
          setHelperStatus('No proof code is saved yet.', 'error');
          return;
        }

        const requestedAt = new Date().toISOString();
        let requestedFormat = null;
        let completedFormat = null;
        setFutureBusy(true);
        setHelperProgress(6, 'Preparing', 'pending');

        try{
          await warmHelperProxy((progress, message)=>{
            setHelperProgress(progress, message, 'pending');
          });
          setHelperProgress(14, 'Checking runtime', 'pending');
          requestedFormat = await resolveHelperFormat(proofPayload.language);
          const attemptSubmit = async (format, progressBaseLabel) => {
            const body = {
              title: proofPayload.title,
              language: proofPayload.language,
              fileName: proofPayload.fileName,
              code: proofPayload.code,
              problemKind: proofPayload.problemKind,
              verify: true,
              async: true,
              format
            };
            setHelperProgress(28, progressBaseLabel, 'pending');
            const { response, raw, payload } = await postHelperSubmitWithRetry(body, (progress, message)=>{
              setHelperProgress(progress, message, 'pending');
            });
            if(!payload || typeof payload !== 'object'){
              if(!response.ok){
                throw new Error(summarizeProxyFailure(response, raw));
              }
              throw new Error(raw || 'Invalid response from helper proxy.');
            }

            if(response.status === 202 && payload.job && payload.job.id){
              setHelperProgress(60, 'Queued', 'pending');
              const result = await waitForHelperJob(payload.job.id, (job)=>{
                const statusView = describeHelperJob(job);
                setHelperProgress(statusView.progress, statusView.message, 'pending');
              });
              return {
                jobId: payload.job.id,
                result
              };
            }

            if(response.ok && payload.result){
              return {
                jobId: null,
                result: payload.result
              };
            }

            throw new Error(extractHelperError(payload, 'Helper conversion failed.'));
          };

          let submitResult;
          try{
            submitResult = await attemptSubmit(requestedFormat, 'Checking proof');
            completedFormat = requestedFormat;
          }catch(primaryError){
            const primaryMessage = primaryError && primaryError.message ? primaryError.message : String(primaryError);
            if(!shouldFallbackToTypedLambda(requestedFormat, primaryMessage)){
              throw primaryError;
            }
            setHelperProgress(34, 'Retrying with typed lambda', 'pending');
            await warmHelperProxy((progress, message)=>{
              setHelperProgress(Math.max(34, progress), message, 'pending');
            });
            submitResult = await attemptSubmit('typed-lambda-v1', 'Retrying locally');
            completedFormat = 'typed-lambda-v1';
          }

          setHelperProgress(92, 'Finalizing result', 'pending');
          const savedResult = await persistProblemOnVercel(
            proofPayload,
            submitResult,
            requestedFormat,
            completedFormat || requestedFormat,
            requestedAt
          );

          const persisted = !!(
            savedResult
            && savedResult.storage
            && savedResult.storage.persisted
          );
          if(!persisted){
            throw new Error('CIC conversion completed, but Supabase save did not persist.');
          }
          const problemId = savedResult && savedResult.problemId ? savedResult.problemId : null;
          const attachmentResult = await persistProblemAttachmentsOnSupabase(problemId, draft);
          const finalResult = savedResult && typeof savedResult === 'object'
            ? {
              ...savedResult,
              attachments: attachmentResult
            }
            : savedResult;
          await persistHelperResult({
            status: 'succeeded',
            requestedAt,
            completedAt: new Date().toISOString(),
            jobId: submitResult.jobId,
            language: proofPayload.language,
            fileName: proofPayload.fileName,
            title: proofPayload.title,
            format: completedFormat || requestedFormat,
            requestedFormat,
            problemId,
            result: finalResult || submitResult.result
          });
          setHelperProgress(
            100,
            attachmentResult && attachmentResult.count
              ? 'Problem and attachments saved'
              : 'Problem saved',
            'success'
          );
          if(persisted && isCicFormat(completedFormat || requestedFormat)){
            await returnToInitialSearchAfterCicSave();
          }
          return;
        }catch(err){
          const message = err && err.message ? err.message : String(err);
          await persistHelperResult({
            status: 'failed',
            requestedAt,
            completedAt: new Date().toISOString(),
            jobId: null,
            language: proofPayload.language,
            fileName: proofPayload.fileName,
            title: proofPayload.title,
            format: completedFormat || requestedFormat,
            requestedFormat,
            error: message
          });
          setHelperStatus(message, 'error');
        }finally{
          setFutureBusy(false);
        }
      }

      function setView(view){
        currentView = view === 'source' ? 'source' : 'slide';
        const isSlide = currentView === 'slide';
        slideViewEl.hidden = !isSlide;
        sourceViewEl.hidden = isSlide;
        slideTabEl.setAttribute('aria-selected', isSlide ? 'true' : 'false');
        sourceTabEl.setAttribute('aria-selected', isSlide ? 'false' : 'true');
        if(isSlide){
          syncStageScale();
        }
      }

      function renderSourceSnapshot(code){
        const text = typeof code === 'string' ? code.replace(/\r\n/g, '\n') : '';
        const lines = text ? text.split('\n') : [''];
        sourceGutterEl.textContent = lines.map((_, index)=>String(index + 1)).join('\n');
        sourceCodeEl.textContent = text || 'No saved proof code yet.';
        sourceCodeEl.classList.toggle('is-empty', !text.trim());
        sourceFileEl.textContent = currentFileName;
        sourceLanguageEl.textContent = currentLanguage;
      }

      function normalizeSlides(record){
        const editorState = record && record.editorState && typeof record.editorState === 'object'
          ? record.editorState
          : null;
        const source = editorState && Array.isArray(editorState.slides)
          ? editorState.slides
          : (editorState && Array.isArray(editorState.uploads)
            ? editorState.uploads.map(upload => ({
              type: 'document',
              hidden: false,
              document: {
                title: upload.title || 'Uploaded file',
                id: upload.id || '',
                blobId: upload.blobId || upload.id || '',
                blobBacked: !!upload.blobBacked,
                path: upload.path || upload.relativePath || upload.title || '',
                relativePath: upload.relativePath || upload.path || upload.title || '',
                kind: upload.kind || 'file',
                ext: upload.ext || '',
                mime: upload.mime || '',
                size: Number(upload.size) || 0,
                checked: true,
                scanStatus: upload.scanStatus || '',
                scanLabel: upload.scanLabel || '',
                scanCheckedAt: upload.scanCheckedAt || '',
                url: upload.url || '',
                text: upload.text || '',
                source: upload.source || 'local',
                provider: upload.provider || '',
                providerKind: upload.providerKind || '',
                webViewLink: upload.webViewLink || '',
                googleFileId: upload.googleFileId || ''
              }
            }))
            : []);
        return source
          .map((slide, index)=>slide && typeof slide === 'object' ? { ...slide, __index: index } : null)
          .filter(Boolean);
      }

      function resolveInitialSlideIndex(record, allSlides){
        const visible = allSlides.filter(slide=>!slide.hidden);
        if(visible.length === 0) return 0;
        const rawIndex = Number(record && record.currentSlideIndex);
        if(!Number.isInteger(rawIndex) || rawIndex < 0) return 0;
        const direct = visible.findIndex(slide=>slide.__index === rawIndex);
        if(direct >= 0) return direct;
        const next = visible.findIndex(slide=>slide.__index > rawIndex);
        if(next >= 0) return next;
        return visible.length - 1;
      }

      function getVisibleSlides(){
        return slides.filter(slide=>slide && !slide.hidden);
      }

      function clampSlideIndex(){
        const visible = getVisibleSlides();
        if(visible.length === 0){
          slideIndex = 0;
          return visible;
        }
        slideIndex = Math.max(0, Math.min(visible.length - 1, slideIndex));
        return visible;
      }

      function createNode(className){
        const el = document.createElement('div');
        el.className = 'slide-node ' + className;
        return el;
      }

      function applyNodeBox(el, node, left, top, width, height){
        const opacity = Number.isFinite(Number(node && node.opacity)) ? Number(node.opacity) : 1;
        const rotation = Number(node && node.rotation) || 0;
        el.style.left = Math.round(left) + 'px';
        el.style.top = Math.round(top) + 'px';
        if(Number.isFinite(width)) el.style.width = Math.max(1, Math.round(width)) + 'px';
        if(Number.isFinite(height)) el.style.height = Math.max(1, Math.round(height)) + 'px';
        el.style.opacity = String(opacity);
        el.style.transform = rotation ? 'rotate(' + rotation + 'deg)' : '';
      }

      function buildSvgLayer(){
        const ns = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('class', 'slide-svg');
        svg.setAttribute('viewBox', '0 0 1280 720');
        const defs = document.createElementNS(ns, 'defs');
        const marker = document.createElementNS(ns, 'marker');
        marker.setAttribute('id', 'previewArrowHead');
        marker.setAttribute('markerWidth', '14');
        marker.setAttribute('markerHeight', '14');
        marker.setAttribute('refX', '10');
        marker.setAttribute('refY', '5');
        marker.setAttribute('orient', 'auto');
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', 'M0,0 L10,5 L0,10 z');
        path.setAttribute('fill', '#111111');
        marker.appendChild(path);
        defs.appendChild(marker);
        svg.appendChild(defs);
        return svg;
      }

      function renderLine(svg, node){
        if(!svg || !node || !Array.isArray(node.points) || node.points.length < 4) return;
        const ns = 'http://www.w3.org/2000/svg';
        const polyline = document.createElementNS(ns, 'polyline');
        const offsetX = Number(node.x) || 0;
        const offsetY = Number(node.y) || 0;
        const points = [];
        for(let i = 0; i < node.points.length; i += 2){
          const px = offsetX + (Number(node.points[i]) || 0);
          const py = offsetY + (Number(node.points[i + 1]) || 0);
          points.push(px + ',' + py);
        }
        polyline.setAttribute('points', points.join(' '));
        polyline.setAttribute('fill', 'none');
        polyline.setAttribute('stroke', node.stroke || '#111111');
        polyline.setAttribute('stroke-width', String(Math.max(1, Number(node.strokeWidth) || 2)));
        polyline.setAttribute('stroke-linecap', 'round');
        polyline.setAttribute('stroke-linejoin', 'round');
        polyline.setAttribute('opacity', String(Number.isFinite(Number(node.opacity)) ? Number(node.opacity) : 1));
        if(node.lineKind === 'arrow' || node.className === 'Arrow'){
          polyline.setAttribute('marker-end', 'url(#previewArrowHead)');
        }
        svg.appendChild(polyline);
      }

      function renderCanvasSlide(container, slide){
        const stage = document.createElement('div');
        stage.style.position = 'absolute';
        stage.style.inset = '0';
        stage.style.background = '#ffffff';
        const svg = buildSvgLayer();
        const nodes = Array.isArray(slide && slide.nodes) ? slide.nodes : [];
        nodes.forEach((node)=>{
          if(!node || typeof node !== 'object') return;
          if(node.className === 'Text'){
            const el = createNode('slide-text');
            applyNodeBox(el, node, Number(node.x) || 0, Number(node.y) || 0, Number(node.width) || 420);
            el.style.fontSize = Math.max(12, Number(node.fontSize) || 28) + 'px';
            el.style.fontFamily = node.fontFamily || 'Arial, sans-serif';
            el.style.color = node.fill || '#111111';
            el.style.lineHeight = String(Number(node.lineHeight) || 1.2);
            el.style.textAlign = node.align || 'left';
            el.textContent = typeof node.text === 'string' ? node.text : '';
            stage.appendChild(el);
            return;
          }
          if(node.className === 'Equation' || node.isEquation){
            const el = createNode('slide-equation');
            applyNodeBox(el, node, Number(node.x) || 0, Number(node.y) || 0, Number(node.width) || 360, Number(node.height) || 60);
            el.style.fontSize = Math.max(18, Number(node.fontSize) || 32) + 'px';
            el.style.color = node.fill || '#111111';
            el.style.lineHeight = String(Number(node.lineHeight) || 1.2);
            el.style.textAlign = node.align || 'left';
            el.textContent = node.equationSource || node.text || '';
            stage.appendChild(el);
            return;
          }
          if(node.className === 'Group' && node.isCssObject){
            const el = createNode('slide-css');
            applyNodeBox(el, node, Number(node.x) || 0, Number(node.y) || 0, 320, 180);
            el.textContent = node.cssObjectSource || 'CSS Object';
            stage.appendChild(el);
            return;
          }
          if(node.className === 'Rect'){
            const el = createNode('slide-shape');
            applyNodeBox(el, node, Number(node.x) || 0, Number(node.y) || 0, Number(node.width) || 120, Number(node.height) || 120);
            el.style.background = node.fill || 'transparent';
            el.style.border = (Number(node.strokeWidth) || 0) > 0
              ? (Math.max(1, Number(node.strokeWidth) || 0) + 'px solid ' + (node.stroke || '#111111'))
              : 'none';
            el.style.borderRadius = (Number(node.cornerRadius) || 0) + 'px';
            stage.appendChild(el);
            return;
          }
          if(node.className === 'Ellipse'){
            const radiusX = Math.max(2, Number(node.radiusX) || 40);
            const radiusY = Math.max(2, Number(node.radiusY) || 40);
            const el = createNode('slide-shape');
            applyNodeBox(el, node, (Number(node.x) || 0) - radiusX, (Number(node.y) || 0) - radiusY, radiusX * 2, radiusY * 2);
            el.style.background = node.fill || 'transparent';
            el.style.border = (Number(node.strokeWidth) || 0) > 0
              ? (Math.max(1, Number(node.strokeWidth) || 0) + 'px solid ' + (node.stroke || '#111111'))
              : 'none';
            el.style.borderRadius = '999px';
            stage.appendChild(el);
            return;
          }
          if(node.className === 'Image' && node.assetSrc){
            const el = createNode('slide-media');
            applyNodeBox(el, node, Number(node.x) || 0, Number(node.y) || 0, Number(node.width) || 240, Number(node.height) || 180);
            const image = document.createElement('img');
            image.className = 'slide-image';
            image.src = node.assetSrc;
            image.alt = '';
            el.appendChild(image);
            stage.appendChild(el);
            return;
          }
          if(node.className === 'Line' || node.className === 'Arrow' || node.lineKind){
            renderLine(svg, node);
          }
        });
        stage.appendChild(svg);
        container.appendChild(stage);
      }

      function getPreviewExtension(value){
        const match = String(value || '').toLowerCase().match(/\.([a-z0-9][a-z0-9+_-]{0,16})($|[?#])/);
        return match ? match[1] : '';
      }

      function getDocumentTitle(documentInfo){
        return documentInfo && documentInfo.title ? String(documentInfo.title) : 'Uploaded file';
      }

      function getDocumentExt(documentInfo){
        return String(
          documentInfo && (
            documentInfo.ext
            || getPreviewExtension(documentInfo.title)
            || getPreviewExtension(documentInfo.path)
            || getPreviewExtension(documentInfo.relativePath)
            || getPreviewExtension(documentInfo.url)
          )
          || ''
        ).toLowerCase();
      }

      function getDocumentMime(documentInfo){
        return String(documentInfo && documentInfo.mime || '').toLowerCase();
      }

      function getDocumentUrl(documentInfo){
        return String(documentInfo && (documentInfo.url || documentInfo.webViewLink) || '').trim();
      }

      function formatBytes(bytes){
        const value = Number(bytes) || 0;
        if(value < 1024) return `${value} B`;
        if(value < 1024 * 1024) return `${Math.round(value / 102.4) / 10} KB`;
        if(value < 1024 * 1024 * 1024) return `${Math.round(value / 1024 / 102.4) / 10} MB`;
        return `${Math.round(value / 1024 / 1024 / 102.4) / 10} GB`;
      }

      function inferDocumentKind(documentInfo){
        const explicit = String(documentInfo && documentInfo.kind || '').toLowerCase();
        const ext = getDocumentExt(documentInfo);
        const mime = getDocumentMime(documentInfo);
        if(mime === 'application/pdf' || ext === 'pdf') return 'pdf';
        if(mime.startsWith('image/')) return 'image';
        if(mime.startsWith('video/')) return 'video';
        if(mime.startsWith('audio/')) return 'audio';
        if(mime === 'text/html' || ['html','htm','xhtml'].includes(ext)) return 'html';
        if(mime.startsWith('text/') || [
          'txt','md','markdown','json','jsonl','csv','tsv','xml','yaml','yml','toml','ini','log',
          'lean','v','coq','tex','bib','js','jsx','ts','tsx','css','scss','sass','less','py','rb',
          'rs','go','java','c','cc','cpp','h','hpp','cs','php','swift','kt','kts','r','sql','sh','bash','zsh'
        ].includes(ext)) return 'text';
        if(['ppt','pptx','key'].includes(ext)) return 'presentation';
        if(['doc','docx','odt','rtf'].includes(ext)) return 'document';
        if(['xls','xlsx','ods'].includes(ext)) return 'spreadsheet';
        if(['zip','7z','rar','tar','gz','bz2','xz'].includes(ext)) return 'archive';
        return explicit || 'file';
      }

      function formatDocumentKind(documentInfo, kind){
        const parts = [kind || 'file'];
        const ext = getDocumentExt(documentInfo);
        const size = Number(documentInfo && documentInfo.size) || 0;
        if(ext) parts.push(ext.toUpperCase());
        if(size) parts.push(formatBytes(size));
        return parts.join(' - ');
      }

      function clearPreviewObjectUrls(){
        previewObjectUrls.forEach(url=>{
          try{
            URL.revokeObjectURL(url);
          }catch(err){
            // Ignore stale preview URL cleanup failures.
          }
        });
        previewObjectUrls = [];
      }

      async function resolveDocumentPreviewSource(documentInfo){
        const inlineUrl = getDocumentUrl(documentInfo);
        if(inlineUrl){
          return { url: inlineUrl, mime: getDocumentMime(documentInfo), revoke: false };
        }
        const blobId = documentInfo && (documentInfo.blobId || documentInfo.id);
        if(!blobId || !store || typeof store.getUploadBlob !== 'function'){
          return { url: '', mime: getDocumentMime(documentInfo), revoke: false };
        }
        const blob = await store.getUploadBlob(blobId);
        if(!blob){
          return { url: '', mime: getDocumentMime(documentInfo), revoke: false };
        }
        return {
          url: URL.createObjectURL(blob),
          mime: blob.type || getDocumentMime(documentInfo),
          revoke: true
        };
      }

      function appendDocumentFacts(parent, documentInfo, kind, mime){
        const facts = document.createElement('div');
        facts.className = 'doc-facts';
        const ext = getDocumentExt(documentInfo);
        const size = Number(documentInfo && documentInfo.size) || 0;
        [
          kind || 'file',
          ext ? ext.toUpperCase() : '',
          mime || getDocumentMime(documentInfo),
          size ? formatBytes(size) : '',
          documentInfo && documentInfo.scanLabel ? documentInfo.scanLabel : ''
        ].filter(Boolean).forEach(value=>{
          const fact = document.createElement('span');
          fact.className = 'doc-fact';
          fact.textContent = value;
          facts.appendChild(fact);
        });
        if(facts.childNodes.length){
          parent.appendChild(facts);
        }
      }

      function createDocumentFallback(documentInfo, kind, source, noteText){
        const fallback = document.createElement('div');
        fallback.className = 'doc-preview-fallback';
        const title = document.createElement('div');
        title.className = 'doc-preview-fallback-title';
        title.textContent = getDocumentTitle(documentInfo);
        const note = document.createElement('div');
        note.className = 'doc-preview-fallback-note';
        note.textContent = noteText || 'This browser does not provide a native preview for this file type.';
        fallback.append(title, note);
        appendDocumentFacts(fallback, documentInfo, kind, source && source.mime);
        const href = documentInfo && (source && source.url || documentInfo.webViewLink || documentInfo.url);
        if(href){
          const link = document.createElement('a');
          link.className = 'doc-link';
          link.href = href;
          link.rel = 'noopener';
          link.target = documentInfo && documentInfo.webViewLink ? '_blank' : '_self';
          link.download = documentInfo && !documentInfo.webViewLink ? getDocumentTitle(documentInfo) : '';
          link.textContent = documentInfo && documentInfo.webViewLink ? 'Open original' : 'Open file';
          fallback.appendChild(link);
        }
        return fallback;
      }

      function renderDocumentBody(body, documentInfo, source){
        const kind = inferDocumentKind(documentInfo);
        const title = getDocumentTitle(documentInfo);
        const url = source && source.url ? source.url : '';
        const mime = source && source.mime ? source.mime : getDocumentMime(documentInfo);
        if(kind === 'pdf' && url){
          const frame = document.createElement('iframe');
          frame.className = 'doc-frame';
          frame.src = url;
          frame.title = title;
          body.appendChild(frame);
          return;
        }
        if(kind === 'image' && url){
          const image = document.createElement('img');
          image.className = 'doc-image';
          image.src = url;
          image.alt = title;
          body.appendChild(image);
          return;
        }
        if(kind === 'video' && url){
          const video = document.createElement('video');
          video.className = 'doc-video';
          video.controls = true;
          video.playsInline = true;
          video.preload = 'metadata';
          video.src = url;
          body.appendChild(video);
          return;
        }
        if(kind === 'audio' && url){
          const wrap = document.createElement('div');
          wrap.className = 'doc-audio-wrap';
          const mark = document.createElement('div');
          mark.className = 'doc-audio-mark';
          mark.textContent = 'A';
          const audio = document.createElement('audio');
          audio.className = 'doc-audio';
          audio.controls = true;
          audio.preload = 'metadata';
          audio.src = url;
          wrap.append(mark, audio);
          appendDocumentFacts(wrap, documentInfo, kind, mime);
          body.appendChild(wrap);
          return;
        }
        if(kind === 'html' && (documentInfo && documentInfo.text || url)){
          const frame = document.createElement('iframe');
          frame.className = 'doc-frame';
          frame.title = title;
          frame.setAttribute('sandbox', '');
          if(documentInfo && documentInfo.text){
            frame.srcdoc = documentInfo.text;
          }else{
            frame.src = url;
          }
          body.appendChild(frame);
          return;
        }
        if(kind === 'text' && documentInfo && typeof documentInfo.text === 'string' && documentInfo.text.length){
          const pre = document.createElement('pre');
          pre.className = 'doc-text';
          pre.textContent = documentInfo.text;
          body.appendChild(pre);
          return;
        }
        if(url){
          const object = document.createElement('object');
          object.className = 'doc-object';
          object.data = url;
          if(mime) object.type = mime;
          object.appendChild(createDocumentFallback(documentInfo, kind, source));
          body.appendChild(object);
          return;
        }
        body.appendChild(createDocumentFallback(
          documentInfo,
          kind,
          source,
          'Preview data is not available for this file in this browser session.'
        ));
      }

      function renderDocumentSlide(container, slide, token){
        const shell = document.createElement('div');
        shell.className = 'doc';
        const documentInfo = slide && slide.document ? slide.document : null;
        const previewKind = inferDocumentKind(documentInfo);
        const meta = document.createElement('div');
        meta.className = 'doc-meta';
        const title = document.createElement('div');
        title.className = 'doc-title';
        title.textContent = getDocumentTitle(documentInfo);
        const kind = document.createElement('div');
        kind.className = 'doc-kind';
        kind.textContent = formatDocumentKind(documentInfo, previewKind);
        meta.appendChild(title);
        meta.appendChild(kind);
        shell.appendChild(meta);

        const body = document.createElement('div');
        body.className = 'doc-body';
        body.appendChild(createDocumentFallback(documentInfo, previewKind, null, 'Loading preview...'));
        shell.appendChild(body);
        container.appendChild(shell);
        resolveDocumentPreviewSource(documentInfo).then(source=>{
          if(token !== slideRenderToken){
            if(source && source.revoke && source.url){
              URL.revokeObjectURL(source.url);
            }
            return;
          }
          if(source && source.revoke && source.url){
            previewObjectUrls.push(source.url);
          }
          body.innerHTML = '';
          renderDocumentBody(body, documentInfo, source);
          syncStageScale();
        }).catch(()=>{
          if(token !== slideRenderToken) return;
          body.innerHTML = '';
          body.appendChild(createDocumentFallback(
            documentInfo,
            previewKind,
            null,
            'Preview data could not be loaded for this file.'
          ));
          syncStageScale();
        });
      }

      function syncStageScale(){
        if(!stageViewport || !stageEl) return;
        const width = Math.max(1, stageViewport.clientWidth - 24);
        const height = Math.max(1, stageViewport.clientHeight - 24);
        const scale = Math.max(0.1, Math.min(width / 1280, height / 720));
        stageEl.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
      }

      function renderCurrentSlide(){
        slideRenderToken += 1;
        const token = slideRenderToken;
        clearPreviewObjectUrls();
        stageEl.innerHTML = '';
        const visible = clampSlideIndex();
        counterEl.textContent = visible.length
          ? deckItemLabel + ' ' + (slideIndex + 1) + ' / ' + visible.length
          : 'No uploads';

        if(visible.length === 0){
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No uploaded files are saved yet.';
          stageEl.appendChild(empty);
          syncStageScale();
          return;
        }

        const current = visible[slideIndex];
        if(current && current.type === 'document'){
          renderDocumentSlide(stageEl, current, token);
        }else{
          renderCanvasSlide(stageEl, current || {});
        }
        syncStageScale();
      }

      function goToPreviousSlide(){
        const visible = getVisibleSlides();
        if(visible.length === 0 || slideIndex <= 0) return;
        slideIndex = Math.max(0, slideIndex - 1);
        renderCurrentSlide();
      }

      function goToNextSlide(){
        const visible = getVisibleSlides();
        if(visible.length === 0 || slideIndex >= visible.length - 1) return;
        slideIndex += 1;
        renderCurrentSlide();
      }

      async function boot(){
        let draft = null;
        if(store && typeof store.read === 'function'){
          draft = await store.read();
        }
        const title = draft && draft.title && typeof draft.title.text === 'string'
          ? draft.title.text.trim()
          : '';
        titleEl.textContent = title || 'Untitled';
        currentProblemKind = getDraftProblemKind(draft);
        currentLanguage = resolveLanguage(
          draft && draft.proof && typeof draft.proof === 'object' ? draft.proof.language : 'Lean'
        );
        draft = await handleBountyReturn(draft);
        syncBountyPanel(draft);
        currentFileName = draft
          && draft.proof
          && typeof draft.proof === 'object'
          && typeof draft.proof.fileName === 'string'
          && draft.proof.fileName.trim()
          ? draft.proof.fileName.trim()
          : (currentLanguage === 'Coq' ? 'Main.v' : 'Main.lean');
        renderSourceSnapshot(
          draft && draft.proof && typeof draft.proof === 'object' && typeof draft.proof.code === 'string'
            ? draft.proof.code
            : ''
        );
        const record = draft && draft.summarySlide && draft.summarySlide.record && typeof draft.summarySlide.record === 'object'
          ? draft.summarySlide.record
          : null;
        deckItemLabel = record && record.uploadMode ? 'File' : 'Slide';
        const helperResult = draft
          && draft.helper
          && draft.helper.lambdaConversion
          && typeof draft.helper.lambdaConversion === 'object'
          ? draft.helper.lambdaConversion
          : null;
        slides = normalizeSlides(record);
        slideIndex = resolveInitialSlideIndex(record, slides);
        renderCurrentSlide();
        setView('slide');
        if(helperResult){
          if(helperResult.status === 'succeeded'){
            setHelperStatus('Saved helper result is available.', 'success');
          }else if(helperResult.status === 'failed' && helperResult.error){
            setHelperStatus(helperResult.error, 'error');
          }
        }
      }

      backBtn.addEventListener('click', ()=>{
        goToProofEditor();
      });
      slideTabEl.addEventListener('click', ()=>{
        setView('slide');
      });
      sourceTabEl.addEventListener('click', ()=>{
        setView('source');
      });
      document.querySelectorAll('[data-bounty-amount]').forEach(button=>{
        button.addEventListener('click', ()=>{
          if(bountyAmountEl){
            bountyAmountEl.value = button.getAttribute('data-bounty-amount') || '10';
          }
        });
      });
      if(bountyCheckoutBtn){
        bountyCheckoutBtn.addEventListener('click', ()=>{
          startBountyCheckout();
        });
      }
      if(futureBtn){
        futureBtn.addEventListener('click', ()=>{
          runHelperConversion();
        });
      }
      document.addEventListener('keydown', (event)=>{
        if(currentView !== 'slide') return;
        if(event.key === 'ArrowLeft'){
          event.preventDefault();
          goToPreviousSlide();
          return;
        }
        if(event.key === 'ArrowRight'){
          event.preventDefault();
          goToNextSlide();
        }
      });
      window.addEventListener('pagehide', clearPreviewObjectUrls);
      if(isMobileLikeDevice()){
        stageViewport.addEventListener('touchstart', (event)=>{
          if(currentView !== 'slide') return;
          const touch = event.touches && event.touches[0];
          if(!touch) return;
          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
        }, { passive: true });
        stageViewport.addEventListener('touchend', (event)=>{
          if(currentView !== 'slide') return;
          const touch = event.changedTouches && event.changedTouches[0];
          if(!touch) return;
          const deltaX = touch.clientX - touchStartX;
          const deltaY = touch.clientY - touchStartY;
          if(Math.abs(deltaX) < 36 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
          if(deltaX < 0){
            goToNextSlide();
          }else{
            goToPreviousSlide();
          }
        }, { passive: true });
      }
      window.addEventListener('resize', syncStageScale);

      boot();
    })();
  </script>
</body>
</html>
