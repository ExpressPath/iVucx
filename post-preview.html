<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Post Preview</title>
  <style>
    :root{
      --bg:#070b11;
      --panel:#0e141c;
      --line:rgba(255,255,255,0.08);
      --ink:#e6edf3;
      --muted:#8b949e;
      --accent:#3fb950;
    }
    *{ box-sizing:border-box; }
    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:var(--bg);
      color:var(--ink);
      font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    body{
      display:flex;
      flex-direction:column;
      background:
        radial-gradient(circle at top left, rgba(63,185,80,0.12), transparent 28%),
        radial-gradient(circle at bottom right, rgba(47,129,247,0.10), transparent 24%),
        var(--bg);
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:12px 16px;
      border-bottom:1px solid var(--line);
      background:rgba(8,12,18,0.9);
      backdrop-filter:blur(10px);
    }
    .topbar-main{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      flex:1 1 auto;
    }
    .btn-back{
      border:1px solid rgba(255,255,255,0.18);
      background:transparent;
      color:#f6f8fa;
      width:38px;
      height:38px;
      border-radius:999px;
      font-size:24px;
      line-height:1;
      cursor:pointer;
    }
    .title-wrap{
      min-width:0;
    }
    .kicker{
      font-size:11px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .title{
      font-size:18px;
      font-weight:700;
      color:#f0f6fc;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .topbar-actions{
      display:flex;
      align-items:center;
      gap:12px;
      flex:0 0 auto;
    }
    .view-switch{
      display:flex;
      align-items:center;
      gap:10px;
      padding:6px 10px;
      border:1px solid rgba(255,255,255,0.1);
      border-radius:999px;
      background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .view-switch:hover .view-divider{
      background:rgba(63,185,80,0.55);
      box-shadow:0 0 10px rgba(63,185,80,0.22);
    }
    .view-tab{
      border:none;
      background:transparent;
      color:rgba(230,237,243,0.68);
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
      letter-spacing:.04em;
      text-transform:uppercase;
      cursor:pointer;
      transition:color .18s ease, background-color .18s ease, transform .12s ease;
    }
    .view-tab:hover{
      color:#f0f6fc;
      background:rgba(255,255,255,0.06);
      transform:translateY(-1px);
    }
    .view-tab[aria-selected="true"]{
      color:#08110c;
      background:linear-gradient(180deg, rgba(111,255,154,0.96), rgba(63,185,80,0.92));
      box-shadow:0 10px 24px rgba(63,185,80,0.18);
    }
    .view-divider{
      width:1px;
      height:24px;
      border-radius:999px;
      background:rgba(255,255,255,0.14);
      transition:background-color .18s ease, box-shadow .18s ease;
    }
    .future-btn{
      border:1px solid rgba(255,255,255,0.1);
      background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      color:rgba(230,237,243,0.72);
      width:42px;
      height:42px;
      border-radius:999px;
      font-size:22px;
      line-height:1;
      cursor:pointer;
      transition:border-color .18s ease, background-color .18s ease, color .18s ease, transform .12s ease, opacity .18s ease;
    }
    .future-btn:hover{
      border-color:rgba(255,255,255,0.16);
      background:rgba(255,255,255,0.06);
      color:#f0f6fc;
      transform:translateY(-1px);
    }
    .future-btn:disabled{
      cursor:progress;
      opacity:.72;
      transform:none;
    }
    .helper-status{
      min-width:180px;
      max-width:320px;
      padding:9px 12px;
      border:1px solid rgba(255,255,255,0.1);
      border-radius:14px;
      background:rgba(255,255,255,0.04);
      color:rgba(230,237,243,0.82);
      font-size:12px;
      line-height:1.35;
      letter-spacing:.01em;
    }
    .helper-status[hidden]{
      display:none;
    }
    .helper-status.pending{
      border-color:rgba(255,255,255,0.14);
      color:#f8fafc;
    }
    .helper-status.success{
      border-color:rgba(63,185,80,0.45);
      color:#8ef0a4;
      background:rgba(63,185,80,0.08);
    }
    .helper-status.error{
      border-color:rgba(248,81,73,0.42);
      color:#ffb4ad;
      background:rgba(248,81,73,0.08);
    }
    .cic-success-popup{
      position:fixed;
      inset:0;
      z-index:80;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:rgba(3,7,12,0.54);
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:opacity .18s ease, visibility .18s ease;
    }
    .cic-success-popup.is-visible{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }
    .cic-success-card{
      width:min(360px, 100%);
      border:1px solid rgba(111,255,154,0.36);
      border-radius:18px;
      padding:24px 22px;
      background:linear-gradient(180deg, rgba(16,26,20,0.98), rgba(8,14,20,0.98));
      box-shadow:0 24px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04) inset;
      text-align:center;
      transform:translateY(8px) scale(.98);
      transition:transform .2s ease;
    }
    .cic-success-popup.is-visible .cic-success-card{
      transform:translateY(0) scale(1);
    }
    .cic-success-mark{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:42px;
      height:42px;
      margin-bottom:14px;
      border-radius:999px;
      background:rgba(63,185,80,0.18);
      border:1px solid rgba(111,255,154,0.42);
      color:#8ef0a4;
      font-size:24px;
      font-weight:800;
    }
    .cic-success-title{
      color:#f0f6fc;
      font-size:18px;
      font-weight:800;
      line-height:1.35;
    }
    .cic-success-copy{
      margin-top:8px;
      color:rgba(230,237,243,0.68);
      font-size:13px;
      line-height:1.5;
    }
    .layout{
      flex:1;
      min-height:0;
      padding:16px;
    }
    .view-shell{
      width:100%;
      height:100%;
      min-height:0;
      position:relative;
    }
    .view-pane{
      width:100%;
      height:100%;
      min-height:0;
    }
    .view-pane[hidden]{
      display:none !important;
    }
    .stage-panel{
      position:relative;
      width:100%;
      height:100%;
      min-height:0;
      overflow:hidden;
      border-radius:18px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(15,20,28,0.96), rgba(9,12,17,0.98));
      box-shadow:0 28px 70px rgba(0,0,0,0.22);
    }
    .stage-viewport{
      position:relative;
      width:100%;
      height:100%;
      min-height:0;
    }
    .stage{
      position:absolute;
      left:50%;
      top:50%;
      width:1280px;
      height:720px;
      overflow:hidden;
      background:#f8fafc;
      color:#111111;
      transform:translate(-50%, -50%) scale(1);
      transform-origin:center center;
      box-shadow:0 28px 70px rgba(0,0,0,0.35);
    }
    .empty{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:36px;
      text-align:center;
      font-size:24px;
      line-height:1.5;
      color:#3d4856;
      background:
        linear-gradient(135deg, rgba(63,185,80,0.08), transparent 35%),
        #f8fafc;
    }
    .stage-counter{
      position:absolute;
      right:18px;
      bottom:18px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.1);
      background:rgba(8,12,18,0.78);
      color:#d0d7de;
      font-size:12px;
      font-weight:700;
      line-height:1;
      letter-spacing:.03em;
      backdrop-filter:blur(8px);
      z-index:2;
    }
    .bounty-panel{
      position:absolute;
      left:18px;
      top:18px;
      z-index:3;
      width:min(340px, calc(100% - 36px));
      border:1px solid rgba(255,255,255,0.12);
      border-radius:16px;
      background:rgba(8,12,18,0.78);
      color:#e6edf3;
      padding:13px;
      box-shadow:0 18px 44px rgba(0,0,0,0.24);
      backdrop-filter:blur(12px);
    }
    .bounty-panel[hidden]{
      display:none;
    }
    .bounty-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .bounty-title{
      font-size:12px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#9be9a8;
    }
    .bounty-state{
      font-size:11px;
      color:rgba(230,237,243,0.68);
      white-space:nowrap;
    }
    .bounty-row{
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      align-items:center;
      gap:8px;
    }
    .bounty-prefix,
    .bounty-currency{
      color:#8b949e;
      font-size:13px;
      font-weight:800;
    }
    .bounty-input{
      width:100%;
      min-width:0;
      height:38px;
      border:1px solid rgba(255,255,255,0.14);
      border-radius:10px;
      background:rgba(255,255,255,0.06);
      color:#f0f6fc;
      font-size:16px;
      font-weight:800;
      padding:0 10px;
      outline:none;
    }
    .bounty-input:focus{
      border-color:rgba(63,185,80,0.55);
      box-shadow:0 0 0 3px rgba(63,185,80,0.12);
    }
    .bounty-chips{
      display:flex;
      gap:6px;
      margin:10px 0;
    }
    .bounty-chip{
      flex:1 1 0;
      height:30px;
      border:1px solid rgba(255,255,255,0.12);
      border-radius:999px;
      background:rgba(255,255,255,0.04);
      color:#d0d7de;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
    }
    .bounty-chip:hover{
      background:rgba(63,185,80,0.1);
      border-color:rgba(63,185,80,0.32);
      color:#9be9a8;
    }
    .bounty-submit{
      width:100%;
      height:38px;
      border:1px solid rgba(63,185,80,0.52);
      border-radius:11px;
      background:linear-gradient(180deg, rgba(111,255,154,0.95), rgba(63,185,80,0.9));
      color:#08110c;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      transition:transform .12s ease, opacity .18s ease;
    }
    .bounty-submit:hover{
      transform:translateY(-1px);
    }
    .bounty-submit:disabled{
      cursor:progress;
      opacity:.68;
      transform:none;
    }
    .bounty-status{
      min-height:16px;
      margin-top:8px;
      color:rgba(230,237,243,0.68);
      font-size:11px;
      line-height:1.45;
    }
    .bounty-status.error{
      color:#ffb4ad;
    }
    .bounty-status.success{
      color:#9be9a8;
    }
    .source-panel{
      display:flex;
      align-items:stretch;
      justify-content:center;
    }
    .source-shell{
      width:100%;
      height:100%;
      min-height:0;
      border-radius:18px;
      border:1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(16,22,29,0.98), rgba(10,14,19,0.98));
      box-shadow:0 28px 70px rgba(0,0,0,0.22);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .source-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:18px 20px 16px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
    }
    .source-kicker{
      font-size:11px;
      font-weight:700;
      letter-spacing:.09em;
      text-transform:uppercase;
      color:#8b949e;
    }
    .source-file-row{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .source-file{
      color:#f0f6fc;
      font-size:15px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .source-language{
      padding:5px 10px;
      border-radius:999px;
      border:1px solid rgba(63,185,80,0.26);
      background:rgba(63,185,80,0.1);
      color:#9be9a8;
      font-size:11px;
      font-weight:700;
      letter-spacing:.05em;
      text-transform:uppercase;
    }
    .source-editor{
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns:auto minmax(0,1fr);
      background:#0d1117;
    }
    .source-gutter{
      min-width:56px;
      margin:0;
      padding:18px 12px 18px 18px;
      border-right:1px solid rgba(255,255,255,0.06);
      color:rgba(139,148,158,0.72);
      font-size:13px;
      line-height:1.75;
      text-align:right;
      white-space:pre;
      user-select:none;
      background:rgba(255,255,255,0.015);
      overflow:hidden;
    }
    .source-code{
      margin:0;
      padding:18px 20px;
      overflow:auto;
      white-space:pre;
      word-break:normal;
      font-size:13px;
      line-height:1.75;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:#e6edf3;
      background:#0d1117;
    }
    .source-code.is-empty{
      color:#8b949e;
      font-style:italic;
    }
    .slide-node{
      position:absolute;
      box-sizing:border-box;
      transform-origin:top left;
    }
    .slide-text{
      white-space:pre-wrap;
      word-break:break-word;
      overflow-wrap:anywhere;
    }
    .slide-equation{
      font-family:"Times New Roman", Georgia, serif;
      font-style:italic;
      white-space:pre-wrap;
    }
    .slide-css{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      border:1px dashed rgba(17,17,17,0.24);
      background:rgba(17,24,39,0.06);
      color:#334155;
      font-size:22px;
      line-height:1.45;
      text-align:center;
    }
    .slide-image{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }
    .slide-svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
    }
    .doc{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      background:#fff;
    }
    .doc-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:18px 22px;
      border-bottom:1px solid rgba(15,23,42,0.08);
      background:#f8fafc;
      color:#0f172a;
    }
    .doc-title{
      min-width:0;
      font-size:20px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .doc-kind{
      font-size:13px;
      color:#64748b;
    }
    .doc-body{
      flex:1;
      min-height:0;
      background:#fff;
      position:relative;
      overflow:hidden;
    }
    .doc-frame,
    .doc-image,
    .doc-video,
    .doc-object,
    .doc-text,
    .doc-empty{
      width:100%;
      height:100%;
      border:none;
      display:block;
    }
    .doc-image{
      object-fit:contain;
    }
    .doc-video{
      background:#020617;
      object-fit:contain;
    }
    .doc-audio-wrap{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:18px;
      padding:34px;
      background:
        linear-gradient(135deg, rgba(63,185,80,0.08), transparent 34%),
        #f8fafc;
      color:#0f172a;
    }
    .doc-audio-mark{
      display:flex;
      align-items:center;
      justify-content:center;
      width:86px;
      height:86px;
      border-radius:50%;
      border:1px solid rgba(15,23,42,0.12);
      background:#ffffff;
      color:#0f172a;
      font-size:38px;
      box-shadow:0 14px 34px rgba(15,23,42,0.08);
    }
    .doc-audio{
      width:min(680px, 88%);
    }
    .doc-object{
      background:#ffffff;
    }
    .doc-text{
      margin:0;
      padding:22px;
      overflow:auto;
      white-space:pre-wrap;
      word-break:break-word;
      font-size:20px;
      line-height:1.55;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:#0f172a;
    }
    .doc-empty{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
      padding:28px;
      font-size:24px;
      color:#475569;
      text-align:center;
    }
    .doc-preview-fallback{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
      padding:30px;
      background:#f8fafc;
      color:#475569;
      text-align:center;
    }
    .doc-preview-fallback-title{
      max-width:760px;
      color:#0f172a;
      font-size:24px;
      font-weight:800;
      line-height:1.25;
      word-break:break-word;
    }
    .doc-preview-fallback-note{
      max-width:760px;
      color:#64748b;
      font-size:14px;
      line-height:1.55;
    }
    .doc-facts{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:8px;
      max-width:820px;
    }
    .doc-fact{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(15,23,42,0.1);
      background:#ffffff;
      color:#475569;
      font-size:12px;
      font-weight:700;
      line-height:1;
      white-space:nowrap;
    }
    .doc-empty small{
      display:block;
      max-width:620px;
      color:#64748b;
      font-size:14px;
      line-height:1.55;
    }
    .doc-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:40px;
      padding:0 16px;
      border-radius:999px;
      background:#0f172a;
      color:#ffffff;
      font-size:13px;
      font-weight:800;
      letter-spacing:.02em;
      text-decoration:none;
    }
    @media (max-width:1020px){
      .topbar{
        padding:10px 12px;
      }
      .topbar-actions{
        gap:10px;
        flex-wrap:wrap;
        justify-content:flex-end;
      }
      .source-meta{
        flex-direction:column;
        align-items:flex-start;
      }
    }
    @media (max-width:760px){
      .topbar{
        flex-direction:column;
        align-items:stretch;
        gap:12px;
      }
      .topbar-main,
      .topbar-actions{
        width:100%;
      }
      .topbar-actions{
        justify-content:space-between;
      }
      .helper-status{
        min-width:0;
        width:100%;
        order:3;
      }
      .title{
        font-size:16px;
      }
      .layout{
        gap:12px;
        padding:12px;
      }
      .view-switch{
        flex:1 1 auto;
        justify-content:center;
      }
      .source-editor{
        grid-template-columns:46px minmax(0,1fr);
      }
      .source-gutter{
        min-width:46px;
        padding-left:10px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-main">
      <button class="btn-back" id="backBtn" type="button" aria-label="Back">&larr;</button>
      <div class="title-wrap">
        <div class="kicker">Post Preview</div>
        <div class="title" id="title">Untitled</div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="view-switch" role="tablist" aria-label="Preview mode">
        <button class="view-tab" id="slideTab" type="button" role="tab" aria-selected="true">Upload</button>
        <span class="view-divider" aria-hidden="true"></span>
        <button class="view-tab" id="sourceTab" type="button" role="tab" aria-selected="false">Source</button>
      </div>
      <button class="future-btn" id="futureBtn" type="button" aria-label="Continue" title="Submit proof to helper server">→</button>
      <div class="helper-status" id="helperStatus" hidden></div>
    </div>
  </header>

    (function(){

      const store = window.ivucxTheoremDraftStore || null;

      let slides = [];

      function resolveLanguage(value){
        const input = String(value || '').trim().toLowerCase();

      function isMobileLikeDevice(){

          (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
