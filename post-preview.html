<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Post Preview</title>
  <style>
    :root{
      --bg:#070b11;
      --panel:#0e141c;
      --line:rgba(255,255,255,0.08);
      --ink:#e6edf3;
      --muted:#8b949e;
      --accent:#3fb950;
    }
    *{ box-sizing:border-box; }
    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:var(--bg);
      color:var(--ink);
      font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    body{
      display:flex;
      flex-direction:column;
      background:
        radial-gradient(circle at top left, rgba(63,185,80,0.12), transparent 28%),
        radial-gradient(circle at bottom right, rgba(47,129,247,0.10), transparent 24%),
        var(--bg);
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:12px 16px;
      border-bottom:1px solid var(--line);
      background:rgba(8,12,18,0.9);
      backdrop-filter:blur(10px);
    }
    .topbar-main{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      flex:1 1 auto;
    }
    .btn-back{
      border:1px solid rgba(255,255,255,0.18);
      background:transparent;
      color:#f6f8fa;
      width:38px;
      height:38px;
      border-radius:999px;
      font-size:24px;
      line-height:1;
      cursor:pointer;
    }
    .title-wrap{
      min-width:0;
    }
    .kicker{
      font-size:11px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .title{
      font-size:18px;
      font-weight:700;
      color:#f0f6fc;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .topbar-actions{
      display:flex;
      align-items:center;
      gap:12px;
      flex:0 0 auto;
    }
    .view-switch{
      display:flex;
      align-items:center;
      gap:10px;
      padding:6px 10px;
      border:1px solid rgba(255,255,255,0.1);
      border-radius:999px;
      background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .view-switch:hover .view-divider{
      background:rgba(63,185,80,0.55);
      box-shadow:0 0 10px rgba(63,185,80,0.22);
    }
    .view-tab{
      border:none;
      background:transparent;
      color:rgba(230,237,243,0.68);
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
      letter-spacing:.04em;
      text-transform:uppercase;
      cursor:pointer;
      transition:color .18s ease, background-color .18s ease, transform .12s ease;
    }
    .view-tab:hover{
      color:#f0f6fc;
      background:rgba(255,255,255,0.06);
      transform:translateY(-1px);
    }
    .view-tab[aria-selected="true"]{
      color:#08110c;
      background:linear-gradient(180deg, rgba(111,255,154,0.96), rgba(63,185,80,0.92));
      box-shadow:0 10px 24px rgba(63,185,80,0.18);
    }
    .view-divider{
      width:1px;
      height:24px;
      border-radius:999px;
      background:rgba(255,255,255,0.14);
      transition:background-color .18s ease, box-shadow .18s ease;
    }
    .future-btn{
      border:1px solid rgba(255,255,255,0.1);
      background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      color:rgba(230,237,243,0.72);
      width:42px;
      height:42px;
      border-radius:999px;
      font-size:22px;
      line-height:1;
      cursor:pointer;
      transition:border-color .18s ease, background-color .18s ease, color .18s ease, transform .12s ease, opacity .18s ease;
    }
    .future-btn:hover{
      border-color:rgba(255,255,255,0.16);
      background:rgba(255,255,255,0.06);
      color:#f0f6fc;
      transform:translateY(-1px);
    }
    .future-btn:disabled{
      cursor:progress;
      opacity:.72;
      transform:none;
    }
    .helper-status{
      min-width:180px;
      max-width:320px;
      padding:9px 12px;
      border:1px solid rgba(255,255,255,0.1);
      border-radius:14px;
      background:rgba(255,255,255,0.04);
      color:rgba(230,237,243,0.82);
      font-size:12px;
      line-height:1.35;
      letter-spacing:.01em;
    }
    .helper-status[hidden]{
      display:none;
    }
    .helper-status.pending{
      border-color:rgba(255,255,255,0.14);
      color:#f8fafc;
    }
    .helper-status.success{
      border-color:rgba(63,185,80,0.45);
      color:#8ef0a4;
      background:rgba(63,185,80,0.08);
    }
    .helper-status.error{
      border-color:rgba(248,81,73,0.42);
      color:#ffb4ad;
      background:rgba(248,81,73,0.08);
    }
    .layout{
      flex:1;
      min-height:0;
      padding:16px;
    }
    .view-shell{
      width:100%;
      height:100%;
      min-height:0;
      position:relative;
    }
    .view-pane{
      width:100%;
      height:100%;
      min-height:0;
    }
    .view-pane[hidden]{
      display:none !important;
    }
    .stage-panel{
      position:relative;
      width:100%;
      height:100%;
      min-height:0;
      overflow:hidden;
      border-radius:18px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(15,20,28,0.96), rgba(9,12,17,0.98));
      box-shadow:0 28px 70px rgba(0,0,0,0.22);
    }
    .stage-viewport{
      position:relative;
      width:100%;
      height:100%;
      min-height:0;
    }
    .stage{
      position:absolute;
      left:50%;
      top:50%;
      width:1280px;
      height:720px;
      overflow:hidden;
      background:#f8fafc;
      color:#111111;
      transform:translate(-50%, -50%) scale(1);
      transform-origin:center center;
      box-shadow:0 28px 70px rgba(0,0,0,0.35);
    }
    .empty{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:36px;
      text-align:center;
      font-size:24px;
      line-height:1.5;
      color:#3d4856;
      background:
        linear-gradient(135deg, rgba(63,185,80,0.08), transparent 35%),
        #f8fafc;
    }
    .stage-counter{
      position:absolute;
      right:18px;
      bottom:18px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.1);
      background:rgba(8,12,18,0.78);
      color:#d0d7de;
      font-size:12px;
      font-weight:700;
      line-height:1;
      letter-spacing:.03em;
      backdrop-filter:blur(8px);
      z-index:2;
    }
    .source-panel{
      display:flex;
      align-items:stretch;
      justify-content:center;
    }
    .source-shell{
      width:100%;
      height:100%;
      min-height:0;
      border-radius:18px;
      border:1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(16,22,29,0.98), rgba(10,14,19,0.98));
      box-shadow:0 28px 70px rgba(0,0,0,0.22);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .source-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:18px 20px 16px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
    }
    .source-kicker{
      font-size:11px;
      font-weight:700;
      letter-spacing:.09em;
      text-transform:uppercase;
      color:#8b949e;
    }
    .source-file-row{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .source-file{
      color:#f0f6fc;
      font-size:15px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .source-language{
      padding:5px 10px;
      border-radius:999px;
      border:1px solid rgba(63,185,80,0.26);
      background:rgba(63,185,80,0.1);
      color:#9be9a8;
      font-size:11px;
      font-weight:700;
      letter-spacing:.05em;
      text-transform:uppercase;
    }
    .source-editor{
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns:auto minmax(0,1fr);
      background:#0d1117;
    }
    .source-gutter{
      min-width:56px;
      margin:0;
      padding:18px 12px 18px 18px;
      border-right:1px solid rgba(255,255,255,0.06);
      color:rgba(139,148,158,0.72);
      font-size:13px;
      line-height:1.75;
      text-align:right;
      white-space:pre;
      user-select:none;
      background:rgba(255,255,255,0.015);
      overflow:hidden;
    }
    .source-code{
      margin:0;
      padding:18px 20px;
      overflow:auto;
      white-space:pre;
      word-break:normal;
      font-size:13px;
      line-height:1.75;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:#e6edf3;
      background:#0d1117;
    }
    .source-code.is-empty{
      color:#8b949e;
      font-style:italic;
    }
    .slide-node{
      position:absolute;
      box-sizing:border-box;
      transform-origin:top left;
    }
    .slide-text{
      white-space:pre-wrap;
      word-break:break-word;
      overflow-wrap:anywhere;
    }
    .slide-equation{
      font-family:"Times New Roman", Georgia, serif;
      font-style:italic;
      white-space:pre-wrap;
    }
    .slide-css{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      border:1px dashed rgba(17,17,17,0.24);
      background:rgba(17,24,39,0.06);
      color:#334155;
      font-size:22px;
      line-height:1.45;
      text-align:center;
    }
    .slide-image{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }
    .slide-svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
    }
    .doc{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      background:#fff;
    }
    .doc-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:18px 22px;
      border-bottom:1px solid rgba(15,23,42,0.08);
      background:#f8fafc;
      color:#0f172a;
    }
    .doc-title{
      font-size:20px;
      font-weight:700;
    }
    .doc-kind{
      font-size:13px;
      color:#64748b;
    }
    .doc-body{
      flex:1;
      min-height:0;
      background:#fff;
    }
    .doc-frame,
    .doc-image,
    .doc-text,
    .doc-empty{
      width:100%;
      height:100%;
      border:none;
      display:block;
    }
    .doc-image{
      object-fit:contain;
    }
    .doc-text{
      margin:0;
      padding:22px;
      overflow:auto;
      white-space:pre-wrap;
      word-break:break-word;
      font-size:20px;
      line-height:1.55;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:#0f172a;
    }
    .doc-empty{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
      padding:28px;
      font-size:24px;
      color:#475569;
      text-align:center;
    }
    .doc-empty small{
      display:block;
      max-width:620px;
      color:#64748b;
      font-size:14px;
      line-height:1.55;
    }
    .doc-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:40px;
      padding:0 16px;
      border-radius:999px;
      background:#0f172a;
      color:#ffffff;
      font-size:13px;
      font-weight:800;
      letter-spacing:.02em;
      text-decoration:none;
    }
    @media (max-width:1020px){
      .topbar{
        padding:10px 12px;
      }
      .topbar-actions{
        gap:10px;
        flex-wrap:wrap;
        justify-content:flex-end;
      }
      .source-meta{
        flex-direction:column;
        align-items:flex-start;
      }
    }
    @media (max-width:760px){
      .topbar{
        flex-direction:column;
        align-items:stretch;
        gap:12px;
      }
      .topbar-main,
      .topbar-actions{
        width:100%;
      }
      .topbar-actions{
        justify-content:space-between;
      }
      .helper-status{
        min-width:0;
        width:100%;
        order:3;
      }
      .title{
        font-size:16px;
      }
      .layout{
        gap:12px;
        padding:12px;
      }
      .view-switch{
        flex:1 1 auto;
        justify-content:center;
      }
      .source-editor{
        grid-template-columns:46px minmax(0,1fr);
      }
      .source-gutter{
        min-width:46px;
        padding-left:10px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-main">
      <button class="btn-back" id="backBtn" type="button" aria-label="Back">&larr;</button>
      <div class="title-wrap">
        <div class="kicker">Post Preview</div>
        <div class="title" id="title">Untitled</div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="view-switch" role="tablist" aria-label="Preview mode">
        <button class="view-tab" id="slideTab" type="button" role="tab" aria-selected="true">Upload</button>
        <span class="view-divider" aria-hidden="true"></span>
        <button class="view-tab" id="sourceTab" type="button" role="tab" aria-selected="false">Source</button>
      </div>
      <button class="future-btn" id="futureBtn" type="button" aria-label="Continue" title="Submit proof to helper server">→</button>
      <div class="helper-status" id="helperStatus" hidden></div>
    </div>
  </header>
  <main class="layout">
    <div class="view-shell">
      <section class="stage-panel view-pane" id="slideView">
        <div class="stage-viewport" id="stageViewport">
          <div class="stage" id="stage"></div>
        </div>
        <div class="stage-counter" id="counter">No slides</div>
      </section>
      <section class="source-panel view-pane" id="sourceView" hidden>
        <div class="source-shell">
          <div class="source-meta">
            <div>
              <div class="source-kicker">Read-only source snapshot</div>
              <div class="source-file-row">
                <div class="source-file" id="sourceFile">Main.lean</div>
                <div class="source-language" id="sourceLanguage">Lean</div>
              </div>
            </div>
          </div>
          <div class="source-editor">
            <pre class="source-gutter" id="sourceGutter"></pre>
            <pre class="source-code" id="sourceCode"></pre>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="theorem-draft-store.js"></script>
  <script>
    (function(){
      const titleEl = document.getElementById('title');
      const slideViewEl = document.getElementById('slideView');
      const sourceViewEl = document.getElementById('sourceView');
      const stageViewport = document.getElementById('stageViewport');
      const stageEl = document.getElementById('stage');
      const counterEl = document.getElementById('counter');
      const backBtn = document.getElementById('backBtn');
      const slideTabEl = document.getElementById('slideTab');
      const sourceTabEl = document.getElementById('sourceTab');
      const futureBtn = document.getElementById('futureBtn');
      const helperStatusEl = document.getElementById('helperStatus');
      const sourceFileEl = document.getElementById('sourceFile');
      const sourceLanguageEl = document.getElementById('sourceLanguage');
      const sourceGutterEl = document.getElementById('sourceGutter');
      const sourceCodeEl = document.getElementById('sourceCode');
      const store = window.ivucxTheoremDraftStore || null;

      let slides = [];
      let slideIndex = 0;
      let currentView = 'slide';
      let currentLanguage = 'Lean';
      let currentFileName = 'Main.lean';
      let deckItemLabel = 'Slide';
      let touchStartX = 0;
      let touchStartY = 0;
      let helperBusy = false;
      let helperInfoRequest = null;
      let helperInfoCache = null;
      let helperPollTicks = 0;

      function resolveLanguage(value){
        const input = String(value || '').trim().toLowerCase();
        if(input === 'coq') return 'Coq';
        if(input === 'isabelle') return 'Isabelle';
        if(input === 'agda') return 'Agda';
        return 'Lean';
      }

      function isMobileLikeDevice(){
        return !!(
          (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
          || (navigator && typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints > 0)
          || ('ontouchstart' in window)
        );
      }

      function goToProofEditor(){
        window.location.href = 'editor.html?lang=' + encodeURIComponent(currentLanguage.toLowerCase());
      }

      function tryParseJson(text){
        if(typeof text !== 'string') return null;
        const trimmed = text.trim();
        if(!trimmed || !/^[\\[{]/.test(trimmed)) return null;
        try{
          return JSON.parse(trimmed);
        }catch(err){
          return null;
        }
      }

      function delay(ms){
        return new Promise((resolve)=>setTimeout(resolve, ms));
      }

      function formatHelperProgress(progress, message){
        const text = String(message || '').trim();
        if(Number.isFinite(progress)){
          const safeProgress = Math.max(0, Math.min(100, Math.round(progress)));
          return text ? `${safeProgress}% ${text}` : `${safeProgress}%`;
        }
        return text;
      }

      function setHelperProgress(progress, message, tone){
        setHelperStatus(formatHelperProgress(progress, message), tone);
      }

      function summarizeProxyFailure(response, raw){
        const status = response && typeof response.status === 'number'
          ? response.status
          : 0;
        const statusText = response && typeof response.statusText === 'string' && response.statusText.trim()
          ? response.statusText.trim()
          : '';
        const normalizedRaw = String(raw || '').trim();
        const lowerRaw = normalizedRaw.toLowerCase();

        if(status === 502){
          return 'Helper proxy returned 502 Bad Gateway. The app may still be waking up.';
        }
        if(status === 503){
          return 'Helper proxy returned 503 Service Unavailable. The app may still be waking up.';
        }
        if(status === 504){
          return 'Helper proxy timed out while waiting for the server.';
        }
        if(normalizedRaw){
          if(lowerRaw.includes('bad gateway')){
            return 'Helper proxy returned 502 Bad Gateway.';
          }
          if(lowerRaw.includes('service unavailable')){
            return 'Helper proxy returned 503 Service Unavailable.';
          }
        }

        return status
          ? ('Helper proxy returned ' + status + (statusText ? (' ' + statusText) : '') + '.')
          : 'Helper proxy request failed.';
      }

      async function warmHelperProxy(onProgress){
        const directHelperBaseUrl = resolveDirectHelperBaseUrl(helperInfoCache);
        const steps = [
          {
            progress: 10,
            label: 'Loading helper',
            baseUrl: '',
            path: '/api/helper/info',
            sameOrigin: true,
            headers: {}
          }
        ];

        if(directHelperBaseUrl){
          steps.push(
            {
              progress: 12,
              label: 'Checking helper',
              baseUrl: directHelperBaseUrl,
              path: '/healthz',
              sameOrigin: false,
              headers: {}
            },
            {
              progress: 14,
              label: 'Loading helper',
              baseUrl: directHelperBaseUrl,
              path: '/api/helper/info',
              sameOrigin: false,
              headers: buildDirectHelperHeaders()
            }
          );
        }

        let helperReady = false;

        for(let round = 0; round < 6; round += 1){
          for(const step of steps){
            if(typeof onProgress === 'function'){
              onProgress(Math.min(24, step.progress + round * 2), step.label);
            }
            try{
              const baseUrl = step.sameOrigin ? '' : step.baseUrl;
              if(!step.sameOrigin && !baseUrl){
                continue;
              }
              const response = await fetch(baseUrl + step.path, {
                method: 'GET',
                cache: 'no-store',
                credentials: step.sameOrigin ? 'same-origin' : 'omit',
                mode: step.sameOrigin ? 'same-origin' : 'cors',
                headers: step.headers || {}
              });
              if(!response.ok){
                continue;
              }
              if(step.path === '/api/helper/info'){
                const raw = await response.text();
                const payload = tryParseJson(raw);
                if(payload && typeof payload === 'object'){
                  helperInfoCache = payload;
                }
                helperReady = true;
                continue;
              }
              if(step.baseUrl === directHelperBaseUrl){
                helperReady = true;
              }
            }catch(err){
              // ignore wake-up probe failures; retry until timeout budget is used
            }
          }

          if(helperReady){
            return true;
          }

          if(round < 5){
            await delay(3000);
          }
        }

        return helperReady;
      }

      function shouldRetryHelperResponse(response, payload, raw){
        if(!response) return false;
        if(![502, 503, 504].includes(response.status)) return false;
        if(payload && typeof payload === 'object') return true;
        const text = String(raw || '').trim().toLowerCase();
        if(!text) return true;
        return (
          text.includes('bad gateway')
          || text.includes('service unavailable')
          || text.includes('hibernate-wake-error')
          || text.includes('no-deploy')
        );
      }

      const DEFAULT_DIRECT_HELPER_BASE_URL = '';
      const HELPER_EXECUTION_BRIDGE_HEADER = 'X-Ivucx-Execution-Base-Url';

      function resolveExecutionBridgeBaseUrl(){
        if(typeof window !== 'undefined' && window.location && typeof window.location.origin === 'string'){
          const origin = window.location.origin.trim();
          if(origin){
            return origin.replace(/\/+$/, '');
          }
        }
        return 'https://provf.onrender.com';
      }

      function buildDirectHelperHeaders(extraHeaders){
        return Object.assign(
          {},
          extraHeaders || {},
          {
            [HELPER_EXECUTION_BRIDGE_HEADER]: resolveExecutionBridgeBaseUrl()
          }
        );
      }

      async function fetchHelperInfoFromUrl(baseUrl, sameOrigin){
        const response = await fetch((baseUrl || '') + '/api/helper/info', {
          method: 'GET',
          cache: 'no-store',
          credentials: sameOrigin ? 'same-origin' : 'omit',
          mode: sameOrigin ? 'same-origin' : 'cors',
          headers: sameOrigin ? {} : buildDirectHelperHeaders()
        });
        const raw = await response.text();
        const payload = tryParseJson(raw);
        return { response, raw, payload };
      }

      async function postHelperSubmitWithRetry(body, onProgress){
        const attempts = [
          { delayMs: 0, progress: 42, label: 'Submitting' },
          { delayMs: 1800, progress: 48, label: 'Waking server' },
          { delayMs: 4200, progress: 54, label: 'Retrying submit' },
          { delayMs: 7000, progress: 58, label: 'Retrying again' }
        ];
        const directHelperBaseUrl = resolveDirectHelperBaseUrl(helperInfoCache);
        let lastRaw = '';
        let lastStatus = 0;

        for(let index = 0; index < attempts.length; index += 1){
          const attempt = attempts[index];
          if(typeof onProgress === 'function'){
            onProgress(attempt.progress, attempt.label);
          }
          if(attempt.delayMs > 0){
            await delay(attempt.delayMs);
          }

          const response = await fetch(directHelperBaseUrl + '/api/helper/submit', {
            method: 'POST',
            cache: 'no-store',
            credentials: directHelperBaseUrl ? 'omit' : 'same-origin',
            mode: directHelperBaseUrl ? 'cors' : 'same-origin',
            headers: {
              'Content-Type': 'application/json',
              ...(directHelperBaseUrl ? buildDirectHelperHeaders() : {})
            },
            body: JSON.stringify(body)
          });

          const raw = await response.text();
          const payload = tryParseJson(raw);
          lastRaw = raw;
          lastStatus = response.status;

          if(!shouldRetryHelperResponse(response, payload, raw) || index === attempts.length - 1){
            return { response, raw, payload };
          }
        }

        throw new Error(lastRaw || ('Helper submission failed with status ' + lastStatus + '.'));
      }

      function shouldFallbackToTypedLambda(requestedFormat, message){
        if(String(requestedFormat || '').trim().toLowerCase() !== 'cic-v1'){
          return false;
        }
        const normalized = String(message || '').trim().toLowerCase();
        if(!normalized){
          return true;
        }
        return (
          normalized.includes('helper proxy returned 502')
          || normalized.includes('helper proxy returned 503')
          || normalized.includes('helper proxy returned 504')
          || normalized.includes('execution server returned 502')
          || normalized.includes('execution server returned 503')
          || normalized.includes('execution server returned 504')
          || normalized.includes('lean cic exporter failed')
          || normalized.includes('coq cic')
          || normalized.includes('spawn lake enoent')
          || normalized.includes('spawn coqc enoent')
          || normalized.includes('invalid response from helper proxy')
          || normalized.includes('bad gateway')
          || normalized.includes('service unavailable')
        );
      }

      function setFutureBusy(busy){
        helperBusy = !!busy;
        if(!futureBtn) return;
        futureBtn.disabled = helperBusy;
        futureBtn.setAttribute('aria-busy', helperBusy ? 'true' : 'false');
        futureBtn.textContent = helperBusy ? '...' : '→';
      }

      function setHelperStatus(message, tone){
        if(!helperStatusEl) return;
        const text = String(message || '').trim();
        helperStatusEl.hidden = !text;
        helperStatusEl.classList.remove('pending', 'success', 'error');
        if(!text){
          helperStatusEl.textContent = '';
          return;
        }
        helperStatusEl.textContent = text;
        if(tone === 'success' || tone === 'error'){
          helperStatusEl.classList.add(tone);
        }else{
          helperStatusEl.classList.add('pending');
        }
      }

      function describeHelperJob(job){
        const status = job && typeof job.status === 'string'
          ? job.status.toLowerCase()
          : '';
        const progressMeta = job && job.progress && typeof job.progress === 'object'
          ? job.progress
          : null;

        if(progressMeta){
          const percent = Number.isFinite(Number(progressMeta.percent))
            ? Number(progressMeta.percent)
            : null;
          const message = typeof progressMeta.message === 'string' && progressMeta.message.trim()
            ? progressMeta.message.trim()
            : (
              typeof progressMeta.stage === 'string' && progressMeta.stage.trim()
                ? progressMeta.stage.trim()
                : ''
            );
          if(percent !== null || message){
            return {
              progress: percent !== null ? percent : (status === 'running' ? 84 : 72),
              message: message || (status === 'running' ? 'Processing' : 'Queued')
            };
          }
        }

        if(status === 'queued'){
          return {
            progress: Math.min(78, 60 + helperPollTicks * 3),
            message: 'Queued'
          };
        }

        if(status === 'running'){
          return {
            progress: Math.min(94, 80 + helperPollTicks * 2),
            message: 'Processing'
          };
        }

        if(status === 'succeeded'){
          return {
            progress: 100,
            message: 'Saved'
          };
        }

        return {
          progress: 70,
          message: 'Working'
        };
      }

      function extractHelperError(payload, fallback){
        if(payload && typeof payload.error === 'string' && payload.error.trim()){
          return payload.error.trim();
        }
        if(payload && payload.job && payload.job.error && typeof payload.job.error.message === 'string'){
          return payload.job.error.message;
        }
        if(payload && payload.details && typeof payload.details.error === 'string'){
          return payload.details.error;
        }
        return fallback || 'Helper request failed.';
      }

      async function fetchHelperInfo(){
        if(helperInfoCache) return helperInfoCache;
        if(helperInfoRequest) return helperInfoRequest;
        helperInfoRequest = (async ()=>{
          const directBaseUrl = resolveDirectHelperBaseUrl(null);
          const attempts = [
            { baseUrl: '', sameOrigin: true }
          ];
          if(directBaseUrl){
            attempts.push({ baseUrl: directBaseUrl, sameOrigin: false });
          }

          for(const attempt of attempts){
            try{
              const { response, payload } = await fetchHelperInfoFromUrl(attempt.baseUrl, attempt.sameOrigin);
              if(!response.ok || !payload || typeof payload !== 'object'){
                continue;
              }
              helperInfoCache = payload;
              return payload;
            }catch(err){
              // try the next transport
            }
          }
          return null;
        })().finally(()=>{
          helperInfoRequest = null;
        });
        return helperInfoRequest;
      }

      function resolveDirectHelperBaseUrl(info){
        const deployment = info && info.deployment && typeof info.deployment === 'object'
          ? info.deployment
          : null;
        const helperServer = deployment && typeof deployment.helperServer === 'string'
          ? deployment.helperServer.trim()
          : '';
        const host = typeof window !== 'undefined' && window.location && typeof window.location.hostname === 'string'
          ? window.location.hostname.trim().toLowerCase()
          : '';
        const isLocalHost = host === 'localhost' || host === '127.0.0.1' || host === '::1';
        if(!isLocalHost){
          return '';
        }
        if(helperServer){
          return helperServer.replace(/\/+$/, '');
        }
        return DEFAULT_DIRECT_HELPER_BASE_URL.replace(/\/+$/, '');
      }

      function resolveCicRuntime(info, language){
        const runtimes = info && info.runtimes && typeof info.runtimes === 'object'
          ? info.runtimes
          : null;
        const conversionRuntimes = runtimes && runtimes.conversionRuntimes && typeof runtimes.conversionRuntimes === 'object'
          ? runtimes.conversionRuntimes
          : null;
        const cic = conversionRuntimes && conversionRuntimes.cic && typeof conversionRuntimes.cic === 'object'
          ? conversionRuntimes.cic
          : null;
        const key = String(language || '').trim().toLowerCase();
        return cic && cic[key] && typeof cic[key] === 'object'
          ? cic[key]
          : null;
      }

      async function resolveHelperFormat(language){
        const info = await fetchHelperInfo();
        const cicRuntime = resolveCicRuntime(info, language);
        if(cicRuntime && cicRuntime.available){
          return 'cic-v1';
        }
        return 'typed-lambda-v1';
      }

      async function persistHelperResult(patch){
        if(!store || typeof store.patch !== 'function'){
          return;
        }
        await store.patch({
          helper: {
            lambdaConversion: patch
          }
        });
      }

      function isTransientHelperJobFailure(status, payload, raw, errorMessage){
        const normalizedError = String(errorMessage || '').trim().toLowerCase();
        if([502, 503, 504].includes(Number(status || 0))){
          return true;
        }
        const payloadMessage = extractHelperError(payload, '').toLowerCase();
        const normalizedRaw = String(raw || '').trim().toLowerCase();
        return (
          normalizedError.includes('bad gateway')
          || normalizedError.includes('service unavailable')
          || normalizedError.includes('gateway timeout')
          || normalizedError.includes('invalid job response')
          || payloadMessage.includes('bad gateway')
          || payloadMessage.includes('service unavailable')
          || payloadMessage.includes('gateway timeout')
          || normalizedRaw.includes('bad gateway')
          || normalizedRaw.includes('service unavailable')
          || normalizedRaw.includes('hibernate-wake-error')
          || normalizedRaw.includes('no-deploy')
        );
      }

      async function fetchHelperJobFromUrl(baseUrl, jobId, sameOrigin){
        const response = await fetch(baseUrl + '/api/helper/jobs/' + encodeURIComponent(jobId), {
          method: 'GET',
          cache: 'no-store',
          credentials: sameOrigin ? 'same-origin' : 'omit',
          mode: sameOrigin ? 'same-origin' : 'cors',
          headers: sameOrigin ? {} : buildDirectHelperHeaders()
        });
        const raw = await response.text();
        const payload = tryParseJson(raw);
        return { response, raw, payload };
      }

      async function fetchHelperJob(jobId){
        const info = await fetchHelperInfo();
        const directBaseUrl = resolveDirectHelperBaseUrl(info);
        const attempts = [];
        if(directBaseUrl){
          attempts.push({
            label: 'direct-helper',
            sameOrigin: false,
            baseUrl: directBaseUrl
          });
        }
        attempts.push({
          label: 'render-proxy',
          sameOrigin: true,
          baseUrl: ''
        });

        let lastError = null;

        for(const attempt of attempts){
          try{
            const { response, raw, payload } = await fetchHelperJobFromUrl(attempt.baseUrl, jobId, attempt.sameOrigin);
            if(!payload || typeof payload !== 'object'){
              const invalidMessage = raw || 'Invalid job response from helper proxy.';
              if(isTransientHelperJobFailure(response.status, null, raw, invalidMessage)){
                lastError = new Error(summarizeProxyFailure(response, raw));
                continue;
              }
              throw new Error(invalidMessage);
            }
            if(!response.ok){
              const errorMessage = extractHelperError(payload, 'Failed to load helper job.');
              if(isTransientHelperJobFailure(response.status, payload, raw, errorMessage)){
                lastError = new Error(errorMessage);
                continue;
              }
              throw new Error(errorMessage);
            }
            return payload;
          }catch(err){
            const message = err && err.message ? err.message : String(err);
            if(isTransientHelperJobFailure(0, null, '', message)){
              lastError = err;
              continue;
            }
            throw err;
          }
        }

        throw lastError || new Error('Failed to load helper job.');
      }

      const HELPER_JOB_TIMEOUT_MS = 45 * 60 * 1000;

      async function waitForHelperJob(jobId, onUpdate){
        const startedAt = Date.now();
        helperPollTicks = 0;
        while(Date.now() - startedAt < HELPER_JOB_TIMEOUT_MS){
          let payload = null;
          try{
            payload = await fetchHelperJob(jobId);
          }catch(err){
            const message = err && err.message ? err.message : String(err);
            if(isTransientHelperJobFailure(0, null, '', message)){
              if(typeof onUpdate === 'function'){
                onUpdate({
                  status: 'running',
                  progress: {
                    percent: Math.min(92, 64 + helperPollTicks * 2),
                    message: 'Reconnecting'
                  }
                }, null);
              }
              await warmHelperProxy((progress, label)=>{
                const adjusted = Math.min(92, Math.max(36, progress));
                setHelperProgress(adjusted, label, 'pending');
              });
              helperPollTicks += 1;
              await delay(2200);
              continue;
            }
            throw err;
          }
          const job = payload && payload.job && typeof payload.job === 'object' ? payload.job : null;
          if(!job){
            throw new Error('Helper job payload is missing.');
          }
          helperPollTicks += 1;
          if(typeof onUpdate === 'function'){
            onUpdate(job, payload);
          }
          if(job.status === 'succeeded'){
            return job.result || null;
          }
          if(job.status === 'failed'){
            throw new Error(extractHelperError(payload, 'Helper job failed.'));
          }
          await delay(1200);
        }
        throw new Error('Timed out while waiting for helper conversion.');
      }

      function getProofPayload(draft){
        const proof = draft && draft.proof && typeof draft.proof === 'object'
          ? draft.proof
          : null;
        if(!proof || typeof proof.code !== 'string' || !proof.code.trim()){
          return null;
        }
        const title = draft && draft.title && typeof draft.title.text === 'string'
          ? draft.title.text.trim()
          : '';
        return {
          title,
          language: resolveLanguage(proof.language || currentLanguage),
          fileName: typeof proof.fileName === 'string' && proof.fileName.trim()
            ? proof.fileName.trim()
            : currentFileName,
          code: proof.code
        };
      }

      async function runHelperConversion(){
        if(helperBusy) return;

        const draft = store && typeof store.read === 'function'
          ? await store.read()
          : null;
        const proofPayload = getProofPayload(draft);

        if(!proofPayload){
          setHelperStatus('No proof code is saved yet.', 'error');
          return;
        }

        const requestedAt = new Date().toISOString();
        let requestedFormat = null;
        let completedFormat = null;
        setFutureBusy(true);
        setHelperProgress(6, 'Preparing', 'pending');

        try{
          await warmHelperProxy((progress, message)=>{
            setHelperProgress(progress, message, 'pending');
          });
          setHelperProgress(14, 'Checking runtime', 'pending');
          requestedFormat = await resolveHelperFormat(proofPayload.language);
          const attemptSubmit = async (format, progressBaseLabel) => {
            const body = {
              title: proofPayload.title,
              language: proofPayload.language,
              fileName: proofPayload.fileName,
              code: proofPayload.code,
              verify: true,
              async: true,
              format
            };
            setHelperProgress(28, progressBaseLabel, 'pending');
            const { response, raw, payload } = await postHelperSubmitWithRetry(body, (progress, message)=>{
              setHelperProgress(progress, message, 'pending');
            });
            if(!payload || typeof payload !== 'object'){
              if(!response.ok){
                throw new Error(summarizeProxyFailure(response, raw));
              }
              throw new Error(raw || 'Invalid response from helper proxy.');
            }

            if(response.status === 202 && payload.job && payload.job.id){
              setHelperProgress(60, 'Queued', 'pending');
              const result = await waitForHelperJob(payload.job.id, (job)=>{
                const statusView = describeHelperJob(job);
                setHelperProgress(statusView.progress, statusView.message, 'pending');
              });
              return {
                jobId: payload.job.id,
                result
              };
            }

            if(response.ok && payload.result){
              return {
                jobId: null,
                result: payload.result
              };
            }

            throw new Error(extractHelperError(payload, 'Helper conversion failed.'));
          };

          let submitResult;
          try{
            submitResult = await attemptSubmit(requestedFormat, 'Checking proof');
            completedFormat = requestedFormat;
          }catch(primaryError){
            const primaryMessage = primaryError && primaryError.message ? primaryError.message : String(primaryError);
            if(!shouldFallbackToTypedLambda(requestedFormat, primaryMessage)){
              throw primaryError;
            }
            setHelperProgress(34, 'Retrying with typed lambda', 'pending');
            await warmHelperProxy((progress, message)=>{
              setHelperProgress(Math.max(34, progress), message, 'pending');
            });
            submitResult = await attemptSubmit('typed-lambda-v1', 'Retrying locally');
            completedFormat = 'typed-lambda-v1';
          }

          await persistHelperResult({
            status: 'succeeded',
            requestedAt,
            completedAt: new Date().toISOString(),
            jobId: submitResult.jobId,
            language: proofPayload.language,
            fileName: proofPayload.fileName,
            title: proofPayload.title,
            format: completedFormat || requestedFormat,
            requestedFormat,
            result: submitResult.result
          });
          setHelperProgress(100, 'Problem saved', 'success');
          return;
        }catch(err){
          const message = err && err.message ? err.message : String(err);
          await persistHelperResult({
            status: 'failed',
            requestedAt,
            completedAt: new Date().toISOString(),
            jobId: null,
            language: proofPayload.language,
            fileName: proofPayload.fileName,
            title: proofPayload.title,
            format: completedFormat || requestedFormat,
            requestedFormat,
            error: message
          });
          setHelperStatus(message, 'error');
        }finally{
          setFutureBusy(false);
        }
      }

      function setView(view){
        currentView = view === 'source' ? 'source' : 'slide';
        const isSlide = currentView === 'slide';
        slideViewEl.hidden = !isSlide;
        sourceViewEl.hidden = isSlide;
        slideTabEl.setAttribute('aria-selected', isSlide ? 'true' : 'false');
        sourceTabEl.setAttribute('aria-selected', isSlide ? 'false' : 'true');
        if(isSlide){
          syncStageScale();
        }
      }

      function renderSourceSnapshot(code){
        const text = typeof code === 'string' ? code.replace(/\r\n/g, '\n') : '';
        const lines = text ? text.split('\n') : [''];
        sourceGutterEl.textContent = lines.map((_, index)=>String(index + 1)).join('\n');
        sourceCodeEl.textContent = text || 'No saved proof code yet.';
        sourceCodeEl.classList.toggle('is-empty', !text.trim());
        sourceFileEl.textContent = currentFileName;
        sourceLanguageEl.textContent = currentLanguage;
      }

      function normalizeSlides(record){
        const editorState = record && record.editorState && typeof record.editorState === 'object'
          ? record.editorState
          : null;
        const source = editorState && Array.isArray(editorState.slides)
          ? editorState.slides
          : (editorState && Array.isArray(editorState.uploads)
            ? editorState.uploads.map(upload => ({
              type: 'document',
              hidden: false,
              document: {
                title: upload.title || 'Uploaded file',
                kind: upload.kind || 'file',
                ext: upload.ext || '',
                mime: upload.mime || '',
                size: Number(upload.size) || 0,
                checked: true,
                url: upload.url || '',
                text: upload.text || '',
                source: upload.source || 'local',
                provider: upload.provider || '',
                providerKind: upload.providerKind || '',
                webViewLink: upload.webViewLink || '',
                googleFileId: upload.googleFileId || ''
              }
            }))
            : []);
        return source
          .map((slide, index)=>slide && typeof slide === 'object' ? { ...slide, __index: index } : null)
          .filter(Boolean);
      }

      function resolveInitialSlideIndex(record, allSlides){
        const visible = allSlides.filter(slide=>!slide.hidden);
        if(visible.length === 0) return 0;
        const rawIndex = Number(record && record.currentSlideIndex);
        if(!Number.isInteger(rawIndex) || rawIndex < 0) return 0;
        const direct = visible.findIndex(slide=>slide.__index === rawIndex);
        if(direct >= 0) return direct;
        const next = visible.findIndex(slide=>slide.__index > rawIndex);
        if(next >= 0) return next;
        return visible.length - 1;
      }

      function getVisibleSlides(){
        return slides.filter(slide=>slide && !slide.hidden);
      }

      function clampSlideIndex(){
        const visible = getVisibleSlides();
        if(visible.length === 0){
          slideIndex = 0;
          return visible;
        }
        slideIndex = Math.max(0, Math.min(visible.length - 1, slideIndex));
        return visible;
      }

      function createNode(className){
        const el = document.createElement('div');
        el.className = 'slide-node ' + className;
        return el;
      }

      function applyNodeBox(el, node, left, top, width, height){
        const opacity = Number.isFinite(Number(node && node.opacity)) ? Number(node.opacity) : 1;
        const rotation = Number(node && node.rotation) || 0;
        el.style.left = Math.round(left) + 'px';
        el.style.top = Math.round(top) + 'px';
        if(Number.isFinite(width)) el.style.width = Math.max(1, Math.round(width)) + 'px';
        if(Number.isFinite(height)) el.style.height = Math.max(1, Math.round(height)) + 'px';
        el.style.opacity = String(opacity);
        el.style.transform = rotation ? 'rotate(' + rotation + 'deg)' : '';
      }

      function buildSvgLayer(){
        const ns = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('class', 'slide-svg');
        svg.setAttribute('viewBox', '0 0 1280 720');
        const defs = document.createElementNS(ns, 'defs');
        const marker = document.createElementNS(ns, 'marker');
        marker.setAttribute('id', 'previewArrowHead');
        marker.setAttribute('markerWidth', '14');
        marker.setAttribute('markerHeight', '14');
        marker.setAttribute('refX', '10');
        marker.setAttribute('refY', '5');
        marker.setAttribute('orient', 'auto');
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', 'M0,0 L10,5 L0,10 z');
        path.setAttribute('fill', '#111111');
        marker.appendChild(path);
        defs.appendChild(marker);
        svg.appendChild(defs);
        return svg;
      }

      function renderLine(svg, node){
        if(!svg || !node || !Array.isArray(node.points) || node.points.length < 4) return;
        const ns = 'http://www.w3.org/2000/svg';
        const polyline = document.createElementNS(ns, 'polyline');
        const offsetX = Number(node.x) || 0;
        const offsetY = Number(node.y) || 0;
        const points = [];
        for(let i = 0; i < node.points.length; i += 2){
          const px = offsetX + (Number(node.points[i]) || 0);
          const py = offsetY + (Number(node.points[i + 1]) || 0);
          points.push(px + ',' + py);
        }
        polyline.setAttribute('points', points.join(' '));
        polyline.setAttribute('fill', 'none');
        polyline.setAttribute('stroke', node.stroke || '#111111');
        polyline.setAttribute('stroke-width', String(Math.max(1, Number(node.strokeWidth) || 2)));
        polyline.setAttribute('stroke-linecap', 'round');
        polyline.setAttribute('stroke-linejoin', 'round');
        polyline.setAttribute('opacity', String(Number.isFinite(Number(node.opacity)) ? Number(node.opacity) : 1));
        if(node.lineKind === 'arrow' || node.className === 'Arrow'){
          polyline.setAttribute('marker-end', 'url(#previewArrowHead)');
        }
        svg.appendChild(polyline);
      }

      function renderCanvasSlide(container, slide){
        const stage = document.createElement('div');
        stage.style.position = 'absolute';
        stage.style.inset = '0';
        stage.style.background = '#ffffff';
        const svg = buildSvgLayer();
        const nodes = Array.isArray(slide && slide.nodes) ? slide.nodes : [];
        nodes.forEach((node)=>{
          if(!node || typeof node !== 'object') return;
          if(node.className === 'Text'){
            const el = createNode('slide-text');
            applyNodeBox(el, node, Number(node.x) || 0, Number(node.y) || 0, Number(node.width) || 420);
            el.style.fontSize = Math.max(12, Number(node.fontSize) || 28) + 'px';
            el.style.fontFamily = node.fontFamily || 'Arial, sans-serif';
            el.style.color = node.fill || '#111111';
            el.style.lineHeight = String(Number(node.lineHeight) || 1.2);
            el.style.textAlign = node.align || 'left';
            el.textContent = typeof node.text === 'string' ? node.text : '';
            stage.appendChild(el);
            return;
          }
          if(node.className === 'Equation' || node.isEquation){
            const el = createNode('slide-equation');
            applyNodeBox(el, node, Number(node.x) || 0, Number(node.y) || 0, Number(node.width) || 360, Number(node.height) || 60);
            el.style.fontSize = Math.max(18, Number(node.fontSize) || 32) + 'px';
            el.style.color = node.fill || '#111111';
            el.style.lineHeight = String(Number(node.lineHeight) || 1.2);
            el.style.textAlign = node.align || 'left';
            el.textContent = node.equationSource || node.text || '';
            stage.appendChild(el);
            return;
          }
          if(node.className === 'Group' && node.isCssObject){
            const el = createNode('slide-css');
            applyNodeBox(el, node, Number(node.x) || 0, Number(node.y) || 0, 320, 180);
            el.textContent = node.cssObjectSource || 'CSS Object';
            stage.appendChild(el);
            return;
          }
          if(node.className === 'Rect'){
            const el = createNode('slide-shape');
            applyNodeBox(el, node, Number(node.x) || 0, Number(node.y) || 0, Number(node.width) || 120, Number(node.height) || 120);
            el.style.background = node.fill || 'transparent';
            el.style.border = (Number(node.strokeWidth) || 0) > 0
              ? (Math.max(1, Number(node.strokeWidth) || 0) + 'px solid ' + (node.stroke || '#111111'))
              : 'none';
            el.style.borderRadius = (Number(node.cornerRadius) || 0) + 'px';
            stage.appendChild(el);
            return;
          }
          if(node.className === 'Ellipse'){
            const radiusX = Math.max(2, Number(node.radiusX) || 40);
            const radiusY = Math.max(2, Number(node.radiusY) || 40);
            const el = createNode('slide-shape');
            applyNodeBox(el, node, (Number(node.x) || 0) - radiusX, (Number(node.y) || 0) - radiusY, radiusX * 2, radiusY * 2);
            el.style.background = node.fill || 'transparent';
            el.style.border = (Number(node.strokeWidth) || 0) > 0
              ? (Math.max(1, Number(node.strokeWidth) || 0) + 'px solid ' + (node.stroke || '#111111'))
              : 'none';
            el.style.borderRadius = '999px';
            stage.appendChild(el);
            return;
          }
          if(node.className === 'Image' && node.assetSrc){
            const el = createNode('slide-media');
            applyNodeBox(el, node, Number(node.x) || 0, Number(node.y) || 0, Number(node.width) || 240, Number(node.height) || 180);
            const image = document.createElement('img');
            image.className = 'slide-image';
            image.src = node.assetSrc;
            image.alt = '';
            el.appendChild(image);
            stage.appendChild(el);
            return;
          }
          if(node.className === 'Line' || node.className === 'Arrow' || node.lineKind){
            renderLine(svg, node);
          }
        });
        stage.appendChild(svg);
        container.appendChild(stage);
      }

      function renderDocumentSlide(container, slide){
        const shell = document.createElement('div');
        shell.className = 'doc';
        const meta = document.createElement('div');
        meta.className = 'doc-meta';
        const title = document.createElement('div');
        title.className = 'doc-title';
        title.textContent = slide && slide.document && slide.document.title ? slide.document.title : 'Document slide';
        const kind = document.createElement('div');
        kind.className = 'doc-kind';
        kind.textContent = slide && slide.document && slide.document.kind ? slide.document.kind : 'document';
        meta.appendChild(title);
        meta.appendChild(kind);
        shell.appendChild(meta);

        const body = document.createElement('div');
        body.className = 'doc-body';
        const documentInfo = slide && slide.document ? slide.document : null;
        if(documentInfo && documentInfo.kind === 'pdf' && documentInfo.url){
          const frame = document.createElement('iframe');
          frame.className = 'doc-frame';
          frame.src = documentInfo.url;
          frame.title = documentInfo.title || 'Document preview';
          body.appendChild(frame);
        }else if(documentInfo && documentInfo.kind === 'image' && documentInfo.url){
          const image = document.createElement('img');
          image.className = 'doc-image';
          image.src = documentInfo.url;
          image.alt = documentInfo.title || 'Document preview';
          body.appendChild(image);
        }else if(documentInfo && documentInfo.kind === 'text'){
          const pre = document.createElement('pre');
          pre.className = 'doc-text';
          pre.textContent = documentInfo.text || '';
          body.appendChild(pre);
        }else{
          const empty = document.createElement('div');
          empty.className = 'doc-empty';
          const title = document.createElement('div');
          title.textContent = documentInfo && documentInfo.title
            ? documentInfo.title
            : 'Uploaded file';
          const note = document.createElement('small');
          note.textContent = documentInfo && documentInfo.source === 'google'
            ? 'This Google file is linked to the post. Open it in Google to inspect the original file.'
            : 'This file is saved with the post, but this browser preview cannot render the format directly.';
          empty.appendChild(title);
          empty.appendChild(note);
          const href = documentInfo && (documentInfo.webViewLink || documentInfo.url);
          if(href){
            const link = document.createElement('a');
            link.className = 'doc-link';
            link.href = href;
            link.target = documentInfo && documentInfo.webViewLink ? '_blank' : '_self';
            link.rel = 'noopener';
            link.textContent = documentInfo && documentInfo.webViewLink ? 'Open in Google' : 'Download file';
            empty.appendChild(link);
          }
          body.appendChild(empty);
        }
        shell.appendChild(body);
        container.appendChild(shell);
      }

      function syncStageScale(){
        if(!stageViewport || !stageEl) return;
        const width = Math.max(1, stageViewport.clientWidth - 24);
        const height = Math.max(1, stageViewport.clientHeight - 24);
        const scale = Math.max(0.1, Math.min(width / 1280, height / 720));
        stageEl.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
      }

      function renderCurrentSlide(){
        stageEl.innerHTML = '';
        const visible = clampSlideIndex();
        counterEl.textContent = visible.length
          ? deckItemLabel + ' ' + (slideIndex + 1) + ' / ' + visible.length
          : 'No uploads';

        if(visible.length === 0){
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No uploaded files are saved yet.';
          stageEl.appendChild(empty);
          syncStageScale();
          return;
        }

        const current = visible[slideIndex];
        if(current && current.type === 'document'){
          renderDocumentSlide(stageEl, current);
        }else{
          renderCanvasSlide(stageEl, current || {});
        }
        syncStageScale();
      }

      function goToPreviousSlide(){
        const visible = getVisibleSlides();
        if(visible.length === 0 || slideIndex <= 0) return;
        slideIndex = Math.max(0, slideIndex - 1);
        renderCurrentSlide();
      }

      function goToNextSlide(){
        const visible = getVisibleSlides();
        if(visible.length === 0 || slideIndex >= visible.length - 1) return;
        slideIndex += 1;
        renderCurrentSlide();
      }

      async function boot(){
        let draft = null;
        if(store && typeof store.read === 'function'){
          draft = await store.read();
        }
        const title = draft && draft.title && typeof draft.title.text === 'string'
          ? draft.title.text.trim()
          : '';
        titleEl.textContent = title || 'Untitled';
        currentLanguage = resolveLanguage(
          draft && draft.proof && typeof draft.proof === 'object' ? draft.proof.language : 'Lean'
        );
        currentFileName = draft
          && draft.proof
          && typeof draft.proof === 'object'
          && typeof draft.proof.fileName === 'string'
          && draft.proof.fileName.trim()
          ? draft.proof.fileName.trim()
          : (currentLanguage === 'Coq' ? 'Main.v' : 'Main.lean');
        renderSourceSnapshot(
          draft && draft.proof && typeof draft.proof === 'object' && typeof draft.proof.code === 'string'
            ? draft.proof.code
            : ''
        );
        const record = draft && draft.summarySlide && draft.summarySlide.record && typeof draft.summarySlide.record === 'object'
          ? draft.summarySlide.record
          : null;
        deckItemLabel = record && record.uploadMode ? 'File' : 'Slide';
        const helperResult = draft
          && draft.helper
          && draft.helper.lambdaConversion
          && typeof draft.helper.lambdaConversion === 'object'
          ? draft.helper.lambdaConversion
          : null;
        slides = normalizeSlides(record);
        slideIndex = resolveInitialSlideIndex(record, slides);
        renderCurrentSlide();
        setView('slide');
        if(helperResult){
          if(helperResult.status === 'succeeded'){
            setHelperStatus('Saved helper result is available.', 'success');
          }else if(helperResult.status === 'failed' && helperResult.error){
            setHelperStatus(helperResult.error, 'error');
          }
        }
      }

      backBtn.addEventListener('click', ()=>{
        goToProofEditor();
      });
      slideTabEl.addEventListener('click', ()=>{
        setView('slide');
      });
      sourceTabEl.addEventListener('click', ()=>{
        setView('source');
      });
      if(futureBtn){
        futureBtn.addEventListener('click', ()=>{
          runHelperConversion();
        });
      }
      document.addEventListener('keydown', (event)=>{
        if(currentView !== 'slide') return;
        if(event.key === 'ArrowLeft'){
          event.preventDefault();
          goToPreviousSlide();
          return;
        }
        if(event.key === 'ArrowRight'){
          event.preventDefault();
          goToNextSlide();
        }
      });
      if(isMobileLikeDevice()){
        stageViewport.addEventListener('touchstart', (event)=>{
          if(currentView !== 'slide') return;
          const touch = event.touches && event.touches[0];
          if(!touch) return;
          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
        }, { passive: true });
        stageViewport.addEventListener('touchend', (event)=>{
          if(currentView !== 'slide') return;
          const touch = event.changedTouches && event.changedTouches[0];
          if(!touch) return;
          const deltaX = touch.clientX - touchStartX;
          const deltaY = touch.clientY - touchStartY;
          if(Math.abs(deltaX) < 36 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
          if(deltaX < 0){
            goToNextSlide();
          }else{
            goToPreviousSlide();
          }
        }, { passive: true });
      }
      window.addEventListener('resize', syncStageScale);

      boot();
    })();
  </script>
</body>
</html>
